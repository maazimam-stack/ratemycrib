<style>
  :root {

  /* ===== ANIMATIONS ===== */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  @keyframes verdictPop {
    0% { opacity: 0; transform: scale(0.6); }
    50% { transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes tiltLeft {
    0%   { transform: rotate(0deg); }
    10%  { transform: rotate(12deg); }
    20%  { transform: rotate(-10deg); }
    30%  { transform: rotate(14deg); }
    40%  { transform: rotate(-8deg); }
    50%  { transform: rotate(10deg); }
    60%  { transform: rotate(-12deg); }
    72%  { transform: rotate(-16deg); }
    85%  { transform: rotate(-18deg); }
    100% { transform: rotate(-16deg); }
  }
  @keyframes tiltRight {
    0%   { transform: rotate(0deg); }
    10%  { transform: rotate(-12deg); }
    20%  { transform: rotate(10deg); }
    30%  { transform: rotate(-14deg); }
    40%  { transform: rotate(8deg); }
    50%  { transform: rotate(-10deg); }
    60%  { transform: rotate(12deg); }
    72%  { transform: rotate(16deg); }
    85%  { transform: rotate(18deg); }
    100% { transform: rotate(16deg); }
  }
  @keyframes tiltEven {
    0%   { transform: rotate(0deg); }
    12%  { transform: rotate(14deg); }
    24%  { transform: rotate(-12deg); }
    36%  { transform: rotate(10deg); }
    48%  { transform: rotate(-10deg); }
    60%  { transform: rotate(8deg); }
    72%  { transform: rotate(-6deg); }
    84%  { transform: rotate(3deg); }
    100% { transform: rotate(0deg); }
  }
  @keyframes verdictReveal {
    0%   { opacity: 0; transform: translateY(8px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* ===== HEAD-TO-HEAD COMPARISON ===== */
  .h2h-picker { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; margin-bottom: 32px; }
  .h2h-select { padding: 12px 16px; border: 2px solid var(--border); border-radius: 2px; font-size: 15px; font-family: inherit; background: var(--card-bg); color: var(--text); min-width: 200px; cursor: pointer; transition: border-color 0.2s; }
  .h2h-select:focus { border-color: var(--orange); outline: none; }
  .h2h-vs { font-size: 20px; font-weight: 900; color: var(--orange); }
  .h2h-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0; margin-bottom: 24px; }
  .h2h-col { text-align: center; }
  .h2h-mid { width: 1px; background: var(--border); margin: 0 16px; }
  .h2h-name { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 4px; color: var(--text); }
  .h2h-badge { display: inline-block; padding: 2px 10px; border-radius: 2px; font-size: 11px; font-weight: 700; margin-bottom: 12px; }
  .h2h-row { display: grid; grid-template-columns: 1fr 100px 1fr; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .h2h-row:last-child { border-bottom: none; }
  .h2h-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; text-align: center; }
  .h2h-val { font-size: 18px; font-weight: 700; text-align: center; }
  .h2h-winner { color: var(--good-text); }
  .h2h-loser { color: var(--muted); }
  @media (max-width: 600px) {
    .h2h-select { min-width: 140px; font-size: 13px; padding: 10px 12px; }
    .h2h-val { font-size: 15px; }
    .h2h-name { font-size: 15px; }
    .h2h-row { grid-template-columns: 1fr 80px 1fr; padding: 10px 0; }
  }

  /* ===== MAP VIEW ===== */
  .map-wrap { position: relative; width: 100%; max-width: 800px; margin: 0 auto 32px; border-radius: 2px; overflow: hidden; border: 1px solid var(--border); background: var(--card-bg); }
  .map-img { width: 100%; display: block; }
  .map-pin { position: absolute; width: 28px; height: 28px; border-radius: 0; border: 3px solid white; cursor: pointer; transform: translate(-50%, -50%); transition: all 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.3); z-index: 2; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; color: white; }
  .map-pin:hover { transform: translate(-50%, -50%) scale(1.3); z-index: 10; }
  .map-pin .map-tooltip { display: none; position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%); background: var(--card-bg); color: var(--text); padding: 10px 14px; border-radius: 2px; font-size: 12px; white-space: nowrap; box-shadow: 0 4px 20px rgba(0,0,0,0.2); border: 1px solid var(--border); font-weight: 600; z-index: 20; pointer-events: none; }
  .map-pin:hover .map-tooltip { display: block; }
  @media (max-width: 600px) {
    .map-pin { width: 22px; height: 22px; font-size: 8px; border-width: 2px; }
  }

  /* ===== SMART TAGS ===== */
  .smart-tag { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 2px; font-size: 11px; font-weight: 600; border: 1px solid; }
  .smart-tag-good { background: rgba(22,163,74,0.08); color: #166534; border-color: rgba(22,163,74,0.2); }
  .smart-tag-warn { background: rgba(234,179,8,0.08); color: #8A5A00; border-color: rgba(234,179,8,0.2); }
  .smart-tag-bad { background: rgba(220,38,38,0.08); color: #B91C1C; border-color: rgba(220,38,38,0.2); }
  .detail-top .smart-tag-good { color: #6EE7B7; } .detail-top .smart-tag-warn { color: #FDE047; } .detail-top .smart-tag-bad { color: #FCA5A5; }
  .smart-tag-neutral { background: rgba(107,114,128,0.08); color: var(--muted); border-color: rgba(107,114,128,0.2); }
  [data-theme="dark"] .smart-tag-good { background: rgba(22,163,74,0.15); color: #6EE7B7; border-color: rgba(22,163,74,0.3); }
  [data-theme="dark"] .smart-tag-warn { background: rgba(234,179,8,0.15); color: #FDE047; border-color: rgba(234,179,8,0.3); }
  [data-theme="dark"] .smart-tag-bad { background: rgba(220,38,38,0.15); color: #FCA5A5; border-color: rgba(220,38,38,0.3); }
  [data-theme="dark"] .smart-tag-neutral { background: rgba(107,114,128,0.15); border-color: rgba(107,114,128,0.3); }

  /* ===== SHARE MODAL ===== */
  .share-btn-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .share-opt { flex: 1; min-width: 100px; padding: 12px; border-radius: 2px; border: 1px solid var(--border); background: var(--card-bg); cursor: pointer; text-align: center; transition: all 0.2s; font-family: inherit; color: var(--text); }

  /* ===== NAV ===== */
  .nav { background: #13294B; -webkit- height: 60px; display: flex; align-items: center; padding: 0 32px; padding-top: env(safe-area-inset-top, 0px); height: calc(60px + env(safe-area-inset-top, 0px)); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .nav-brand { font-family: var(--font-display); font-size: 23px; font-weight: 600; letter-spacing: 0.2px; color: var(--text-primary); cursor: pointer; text-transform: uppercase; }
  .nav-brand em { font-style: normal; color: var(--brand-orange); }
  .nav-right { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  .nav-link { position: relative; color: rgba(255,255,255,0.6); font-size: 13.5px; font-weight: 500; cursor: pointer; padding: 7px 14px; border-radius: 2px; transition: all 0.2s ease; }
  .nav-link:hover { color: rgba(255,255,255,0.92); background: rgba(255,255,255,0.06); }
  .nav-link.active { color: var(--text-primary); background: none; box-shadow: inset 0 -2px 0 var(--brand-orange); }
  .nav-tools-wrap { position: relative; }
  .nav-tools-btn { color: rgba(255,255,255,0.55); font-size: 13.5px; font-weight: 500; cursor: pointer; padding: 7px 14px; border-radius: 2px; transition: all 0.2s ease; background: none; border: none; font-family: inherit; display: flex; align-items: center; gap: 4px; }
  .nav-tools-btn:hover { color: rgba(255,255,255,0.9); background: rgba(255,255,255,0.08); }

  .nav-tools-dropdown { display: none; position: absolute; top: calc(100% + 8px); right: 0; background: rgba(20,20,20,0.98); -webkit- border: 1px solid rgba(255,255,255,0.1); border-radius: 2px; padding: 6px; min-width: 200px; z-index: 200; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }

  .nav-tools-item:hover { color: white; background: rgba(255,255,255,0.08); }
  .nav-tools-item .tools-desc { display: block; font-size: 11px; color: rgba(255,255,255,0.35); font-weight: 400; margin-top: 1px; }
  .nav-cta { background: var(--orange-btn); color: white; border: none; padding: 8px 20px; border-radius: 2px; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s ease; font-family: inherit; margin-left: 8px; }
  .nav-cta:hover { background: #E04E00; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(255,95,5,0.3); }

  /* ===== HERO — editorial masthead split ===== */
  .hero { padding: 56px 32px 0; background: var(--brand-navy); position: relative; overflow: hidden; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .hero-inner { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 48px; align-items: end; }
  .hero-eyebrow { font-family: var(--font-display); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; color: var(--brand-gold); margin-bottom: 14px; animation: fadeUp 0.6s ease; }
  .hero h1 { font-family: var(--font-display); font-size: 50px; font-weight: 700; text-transform: uppercase; letter-spacing: -0.5px; line-height: 1.02; margin-bottom: 16px; animation: fadeUp 0.6s ease 0.1s both; color: var(--text-primary); }
  .hero h1 em { font-style: normal; color: var(--brand-orange); }
  .hero p { font-size: 16px; color: rgba(245,243,239,0.62); max-width: 420px; margin: 0 0 28px; line-height: 1.6; animation: fadeUp 0.6s ease 0.2s both; }
  .search-tags { display: flex; gap: 8px; margin-top: 22px; margin-bottom: 40px; flex-wrap: wrap; animation: fadeUp 0.6s ease 0.4s both; }
  .search-tag { padding: 8px 16px; border-radius: 2px; background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.78); font-size: 13px; cursor: pointer; transition: all 0.2s ease; border: 1px solid rgba(255,255,255,0.1); font-weight: 500; }
  .search-tag:hover { border-color: rgba(217,164,65,0.5); color: var(--brand-gold); background: rgba(217,164,65,0.1); }
  .search-tag.active { background: var(--brand-gold); color: #13294B; border-color: var(--brand-gold); font-weight: 700; }
  .hero-live { position: relative; padding-bottom: 40px; animation: fadeUp 0.6s ease 0.25s both; }
  .hero-live-label { font-family: var(--font-display); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-secondary); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .hero-live-dot { width: 6px; height: 6px; border-radius: 0; background: var(--rating-great); box-shadow: 0 0 0 3px rgba(74,222,128,0.2); }
  .hero-review-card { background: var(--bg-elevated, #14171C); border: 1px solid rgba(255,255,255,0.1); border-radius: 2px; padding: 18px; box-shadow: 0 16px 40px rgba(0,0,0,0.35); transition: opacity 0.4s ease; }
  .hero-review-top { display: flex; gap: 12px; }

  /* ===== STATS BAR ===== */
  .stats-bar { background: var(--light); padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--border); }

  .nc-street { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 2px; background: transparent; color: var(--text); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; text-align: left; }

  .nc-show { margin-top: 12px; min-height: 44px; padding: 10px 16px; border: none; border-radius: 2px; background: var(--orange-btn); color: #fff; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }

  .street-pick-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 10px; }
  @media (max-width: 720px) { .nc-form, .nc-grid { grid-template-columns: 1fr; } .nc-year { flex: 1 1 calc(50% - 6px); } }
  .street-chip { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 8px 14px; border: 1.5px solid var(--border); border-radius: 2px; background: var(--card-bg); color: var(--text); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
  .street-chip:hover { border-color: var(--orange); }

  .street-chip.on { background: var(--brand-navy); border-color: var(--brand-navy); color: #fff; }
  .street-chip-n { font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace; font-size: 12px; font-weight: 600; color: var(--muted); }

  .street-none { font-size: 14px; color: var(--muted); margin: 8px 0; }
  .street-clear { margin: 4px 0 0; }
  .street-clear button, .street-remove { background: none; border: none; padding: 6px 0; font: inherit; font-size: 13px; font-weight: 600; color: var(--orange); cursor: pointer; }
  .street-empty { margin-top: 28px; padding: 24px; border: 1px dashed var(--border); border-radius: 2px; font-size: 15px; line-height: 1.6; color: var(--text); background: var(--card-bg); }
  .street-section { margin-top: 36px; }
  .street-head { display: flex; align-items: baseline; gap: 6px 16px; flex-wrap: wrap; border-bottom: 2px solid var(--text); padding-bottom: 8px; margin-bottom: 4px; }

  .street-head-meta { font-size: 13px; color: var(--muted); flex: 1 1 auto; }
  .street-block { font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); padding: 16px 0 8px; }
  .bldg { display: flex; gap: 16px; padding: 16px; border: 1px solid var(--border); border-radius: 2px; background: var(--card-bg); margin-bottom: 10px; }
  .bldg-score { flex: 0 0 68px; align-self: flex-start; text-align: center; padding: 10px 4px; border-radius: 2px; }

  .street-foot { margin: 36px 0 8px; text-align: center; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 14px; }

  .home-street-link a { color: var(--orange); font-weight: 600; }
  @media (max-width: 600px) { .bldg { gap: 12px; padding: 14px; } .bldg-score { flex-basis: 56px; } .street-head h3 { font-size: 21px; } }
  .hood-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .hood-card { border: 1px solid var(--border); border-radius: 2px; padding: 24px; transition: all 0.25s ease; background: var(--white); box-shadow: var(--shadow-sm); }
  .hood-card:hover { box-shadow: 0 12px 40px rgba(0,0,0,0.08); border-color: rgba(255,95,5,0.2); }
  .hood-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.3px; }
  .hood-type { font-size: 12px; color: var(--orange); margin-bottom: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }

  .hood-row span { color: var(--muted); }
  .hood-row strong { font-weight: 700; }

  /* ===== COMPARE ===== */
  .compare-tbl { width: 100%; border-collapse: separate; border-spacing: 0; border-radius: 2px; overflow: hidden; border: 1px solid var(--border); }
  .compare-tbl th { text-align: left; padding: 12px 16px; background: var(--black); color: white; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .compare-tbl td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .compare-tbl tr:last-child td { border-bottom: none; }
  .compare-tbl tr:hover td { background: #F8FAFC; }
  .val-good { color: var(--green); font-weight: 700; }
  .val-ok { color: var(--yellow); font-weight: 700; }
  .val-bad { color: var(--red); font-weight: 700; }

  /* ===== PROMO STRIP ===== */
  .promo { background: var(--brand-navy); border-radius: 2px; padding: 36px 40px; margin: 40px 0; display: flex; justify-content: space-between; align-items: center; gap: 24px; position: relative; overflow: hidden; }
  .promo h3 { color: white; font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
  .promo p { color: rgba(255,255,255,0.75); font-size: 14px; margin-top: 6px; line-height: 1.5; }
  .promo button { background: var(--orange-btn); color: white; border: none; padding: 12px 28px; border-radius: 2px; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; transition: all 0.2s; font-family: inherit; position: relative; z-index: 1; }
  .promo button:hover { background: #E04E00; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,95,5,0.4); }

  /* ===== FOOTER ===== */
  footer { background: var(--light); border-top: 1px solid var(--border); padding: 48px 32px 32px; margin-top: 48px; }
  .footer-inner { max-width: 960px; margin: 0 auto; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 32px; }
  .footer-col h4 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text); margin-bottom: 14px; }
  .footer-col a { display: block; font-size: 13px; color: var(--muted); padding: 4px 0; cursor: pointer; transition: color 0.2s; }
  .footer-col a:hover { color: var(--orange); }
  .footer-bottom { max-width: 960px; margin: 24px auto 0; padding-top: 24px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }

  /* ===== LEASE SCANNER ===== */
  .scanner-header { background: var(--brand-navy); padding: 48px 24px 40px; text-align: center; margin-bottom: 0; position: relative; overflow: hidden; }
  .scanner-header h2 { font-size: 32px; font-weight: 900; color: white; letter-spacing: -1px; margin-bottom: 8px; position: relative; }
  .scanner-header p { color: rgba(255,255,255,0.5); font-size: 15px; line-height: 1.6; max-width: 500px; margin: 0 auto; position: relative; }
  .scanner-wrap { max-width: 720px; margin: 0 auto; padding: 32px 24px; }
  .scanner-wrap h2 { font-size: 28px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.5px; }
  .scanner-desc { color: var(--muted); font-size: 15px; margin-bottom: 24px; line-height: 1.6; }
  .scanner-disclaimer { background: #FFF7ED; border: 1px solid #FDBA74; border-radius: 2px; padding: 16px 20px; margin-bottom: 24px; font-size: 13px; color: #92400E; line-height: 1.6; }
  .scanner-disclaimer strong { color: #C2410C; }
  [data-theme="dark"] .scanner-disclaimer strong, [data-theme="dark"] .scanner-disclaimer a { color: #FDBA74; }
  .scanner-textarea { width: 100%; min-height: 200px; padding: 16px; border: 2px solid var(--border); border-radius: 2px; font-size: 14px; font-family: inherit; line-height: 1.6; resize: vertical; outline: none; transition: all 0.25s; }
  .scanner-textarea:focus { border-color: var(--orange); box-shadow: 0 0 0 4px rgba(255,95,5,0.08); }
  .scanner-textarea::placeholder { color: #B0B0B0; }
  .scan-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--black); color: white; border: none; padding: 14px 32px; border-radius: 2px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 16px; transition: all 0.2s; font-family: inherit; }
  .scan-btn:hover { background: #222; transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .scan-btn:disabled { background: #D1D5DB; cursor: not-allowed; transform: none; box-shadow: none; }
  .scan-results { margin-top: 32px; }
  .scan-summary { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  .scan-stat { flex: 1; min-width: 120px; border-radius: 2px; padding: 20px; text-align: center; }
  .scan-stat-num { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; }
  .scan-stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; font-weight: 600; }
  .scan-stat.red { background: rgba(240,85,74,0.12); }
  .scan-stat.red .scan-stat-num { color: var(--rate-poor-text); }
  .scan-stat.yellow { background: rgba(217,164,65,0.12); }
  .scan-stat.yellow .scan-stat-num { color: var(--rate-mixed-text); }
  .scan-stat.green { background: rgba(74,222,128,0.12); }
  .scan-stat.green .scan-stat-num { color: var(--rate-great-text); }
  .flag-card { border: 1px solid var(--border); border-radius: 2px; padding: 20px; margin-bottom: 12px; border-left: 4px solid; transition: box-shadow 0.2s; }
  .flag-card:hover { box-shadow: var(--shadow-sm); }
  .flag-card.severity-high { border-left-color: #DC2626; background: #FFF5F5; }
  .flag-card.severity-medium { border-left-color: #D97706; background: #FFFBEB; }
  .flag-card.severity-low { border-left-color: #2563EB; background: #EFF6FF; }
  .flag-severity { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
  .flag-card.severity-high .flag-severity { color: #DC2626; }
  .flag-card.severity-medium .flag-severity { color: #D97706; }
  .flag-card.severity-low .flag-severity { color: #2563EB; }
  .flag-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.2px; }
  .flag-match { font-size: 13px; background: rgba(0,0,0,0.04); padding: 10px 14px; border-radius: 2px; margin-bottom: 10px; font-family: 'SF Mono', 'Fira Code', monospace; line-height: 1.5; border: 1px solid rgba(0,0,0,0.06); }
  .flag-explain { font-size: 14px; line-height: 1.65; color: var(--text); margin-bottom: 10px; }
  .flag-statute { font-size: 12px; color: var(--blue); font-weight: 600; }
  .scan-clean { text-align: center; padding: 48px; background: rgba(74,222,128,0.12); border-radius: 2px; margin-top: 24px; }
  .scan-clean h3 { font-size: 22px; font-weight: 700; color: #166534; margin-bottom: 8px; }
  .scan-clean p { font-size: 14px; color: #065F46; line-height: 1.6; }

  /* ===== SCANNER ENHANCEMENTS ===== */
  .scanner-upload-zone { border: 2px dashed var(--border); border-radius: 2px; padding: 28px; text-align: center; margin-bottom: 16px; cursor: pointer; transition: all 0.25s; background: var(--light); }

  .scanner-upload-zone .upload-text strong { color: var(--orange); cursor: pointer; }
  .scanner-or-divider { text-align: center; color: var(--muted); font-size: 13px; font-weight: 600; margin: 12px 0; position: relative; }
  .scanner-or-divider::before, .scanner-or-divider::after { content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: var(--border); }
  .scanner-or-divider::before { left: 0; }
  .scanner-or-divider::after { right: 0; }
  .scanner-progress { margin-top: 16px; display: none; }
  .scanner-progress-bar { height: 6px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .scanner-progress-fill { height: 100%; background: var(--orange); border-radius: 2px; transition: width 0.3s; width: 0%; }
  .scanner-progress-text { font-size: 12px; color: var(--muted); margin-top: 6px; text-align: center; }
  .interest-modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 9998; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.2s; }
  .interest-modal { background: var(--card-bg); border-radius: 2px; padding: 32px; max-width: 440px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.2); animation: fadeUp 0.3s; }

  .interest-modal input[type="email"]:focus { border-color: var(--orange); }
  .interest-modal-btns { display: flex; gap: 10px; }
  .interest-modal-btns button { flex: 1; padding: 12px; border-radius: 2px; font-size: 14px; font-weight: 700; cursor: pointer; border: none; font-family: inherit; transition: all 0.2s; }
  .interest-modal-btns .btn-primary { background: var(--black); color: white; }
  .interest-modal-btns .btn-primary:hover { background: #222; }
  .interest-modal-btns .btn-secondary { background: var(--light); color: var(--muted); border: 1px solid var(--border); }
  .interest-modal-btns .btn-secondary:hover { background: #eee; }
  .scanner-cta-bar { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  .scanner-cta-bar button { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 2px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; font-family: inherit; transition: all 0.2s; }
  .scanner-cta-bar .cta-notify { background: var(--orange-btn); color: white; }
  .scanner-cta-bar .cta-notify:hover { background: #d4431f; transform: translateY(-1px); }
  .hidden { display: none !important; }

  /* ===== MOBILE NAV HAMBURGER ===== */
  .nav-actions { margin-left: 8px; display: flex; align-items: center; gap: 4px; }
  .nav-toggle { display: none; background: none; border: none; cursor: pointer; padding: 8px; }
  .nav-toggle svg { display: block; }
  .nav-right.mobile-open { display: flex !important; }

  /* ===== LOADING STATE ===== */
  .loading-dot { display: inline-block; width: 6px; height: 6px; border-radius: 0; background: var(--orange); animation: pulse 1s ease infinite; margin: 0 2px; }
  .loading-dot:nth-child(2) { animation-delay: 0.15s; }
  .loading-dot:nth-child(3) { animation-delay: 0.3s; }

  /* ===== HERO CTA BUTTON ===== */
  .hero-cta { padding: 16px 36px; font-size: 16px; font-weight: 700; background: var(--orange-btn); color: white; border: none; border-radius: 2px; cursor: pointer; font-family: inherit; box-shadow: 0 2px 8px rgba(0,0,0,0.2); transition: all 0.2s ease; letter-spacing: 0.3px; }
  .hero-cta:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.25); }
  .hero-search { display: flex; max-width: 460px; margin: 0 0 22px; animation: fadeUp 0.6s ease 0.25s both; }
  .hero-search input { flex: 1; min-width: 0; min-height: 48px; padding: 12px 14px; border: 2px solid #fff; border-right: 0; border-radius: 2px 0 0 2px; background: #fff; color: #13294B; font: inherit; font-size: 16px; outline: none; }
  .hero-search input::placeholder { color: #5B6578; }
  .hero-search input:focus { border-color: var(--brand-gold); }
  .hero-search button { min-height: 48px; padding: 0 18px; border: 2px solid #fff; border-radius: 0 2px 2px 0; background: #fff; color: #13294B; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; border-left: 1px solid #D6D2C8; }
  .hero-search button:hover { background: #F4F1EA; }
  .second-review-btn { width: 100%; min-height: 48px; padding: 12px; margin-bottom: 18px; background: transparent; color: var(--text); border: 1.5px solid var(--border); border-radius: 2px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
  .roommate-box { text-align: left; border: 1.5px solid var(--orange); border-radius: 2px; padding: 14px; margin-bottom: 12px; }
  .roommate-box p { font-size: 14px; color: var(--text); line-height: 1.5; margin-bottom: 10px; }
  .roommate-btn { width: 100%; min-height: 48px; padding: 12px; background: var(--orange-btn); color: #fff; border: none; border-radius: 2px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
  .almost-rated { padding-top: 28px; }
  .almost-rated h2 { font-family: var(--font-display); font-size: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; margin-bottom: 4px; }
  .almost-rated p { font-size: 14px; color: var(--muted); margin-bottom: 12px; max-width: 65ch; }
  .ar-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .ar-chip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 2px; background: var(--card-bg); color: var(--text); font-size: 14px; font-weight: 600; }
  .ar-chip:hover { border-color: var(--orange); }
  .ar-chip small { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; font-weight: 400; color: var(--orange-text, #C2410C); white-space: nowrap; }
  [data-theme="dark"] .ar-chip small { color: #FF8A47; }
  .rating-progress { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; }
  .rating-progress p { font-size: 14px; color: var(--muted); margin: 0; }
  .rating-progress strong { color: var(--text); }
  .rating-progress a { color: var(--text); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .rp-bar { flex: 0 0 72px; height: 8px; background: var(--border); }
  .rp-bar i { display: block; height: 100%; background: var(--orange); }

// same rule, so /landlord/<slug>/ and #landlord/<slug> always mean the same landlord.

  var ul = (typeof userLandlords !== 'undefined' && userLandlords) ? userLandlords : [];
  if (_slugCache.map && _slugCache.src === ul && _slugCache.n === ul.length) return _slugCache;
  var all = SEED_LANDLORDS.slice().sort(function(a, b) { return a.id - b.id; })
    .concat(ul.slice().sort(function(a, b) { return a.id - b.id; }));
  var map = Object.create(null), byId = Object.create(null);
  all.forEach(function(l) {

}

// Normalize an address for comparison: lowercase, strip punctuation, collapse spaces.
function normAddr(s) {
  return (s || '').toLowerCase().replace(/[.,#]/g, '').replace(/\s+/g, ' ').trim();
}

// Check if a typed address matches a known address pattern.
// Uses word-boundary matching to avoid false positives:
//   "51 E Green" must NOT match "151 E Green" or "1051 E Green".
// For numeric addresses, the number must match exactly (start of string or after space).
// For named places ("Busey Court", "Bromley Hall"), requires exact phrase match.
function addrMatches(typed, known) {
  const t = normAddr(typed);
  const k = normAddr(known);
  if (!t || !k) return false;

  // If known starts with a digit, do a word-boundary match on the number
  if (/^\d/.test(k)) {
    // Build regex: word-boundary + known pattern (escaped) at start or after space
    // e.g., "51 e green" → matches "51 e green st apt 4" but NOT "151 e green"
    const escaped = k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp('(?:^|\\s)' + escaped, 'i');
    return re.test(t) || re.test(' ' + t);
  }
  // Named place: require the full phrase to appear
  return t.includes(k);
}

// Fuzzy-match a typed address against KNOWN_PROPERTIES + existing reviews.
// Returns { landlordId, landlordName, source } or null if no match.
// source: "verified" (curated list) or "reviews" (crowd-sourced from existing reviews)
function matchAddressToLandlord(address) {
  if (!address || address.length < 4) return null;

  // 1) Check curated KNOWN_PROPERTIES first (highest confidence)
  for (const kp of KNOWN_PROPERTIES) {
    if (addrMatches(address, kp.addr)) {
      const seed = SEED_LANDLORDS.find(l => l.id === kp.lid);
      if (seed) return { landlordId: seed.id, landlordName: seed.name, source: 'verified' };
    }
  }

  // 2) Learn from existing reviews: if 2+ reviews map this address to the
  //    same landlord, use that as a suggestion. This makes the system smarter
  //    over time without manual updates.
  const revs = allReviews();
  const addrCounts = {};
  const nStreet = normAddr(address).replace(/\s*(apt|unit|#|suite)\s*.*/i, '').trim();
  if (nStreet.length < 5) return null;

  for (const r of revs) {
    if (!r.property) continue;
    const rStreet = normAddr(r.property).replace(/\s*(apt|unit|#|suite)\s*.*/i, '').trim();
    if (rStreet.length < 5) continue;
    // Use the safe word-boundary match in both directions
    if (addrMatches(rStreet, nStreet) || addrMatches(nStreet, rStreet)) {
      const key = r.landlordId;
      if (!addrCounts[key]) addrCounts[key] = { count: 0, name: r.landlordName };
      addrCounts[key].count++;
    }
  }
  // Only suggest if 2+ reviews agree on the same landlord
  const topMatch = Object.entries(addrCounts).sort((a,b) => b[1].count - a[1].count)[0];
  if (topMatch && topMatch[1].count >= 2) {
    const lid = parseInt(topMatch[0]);
    const l = findLandlord(lid);
    if (l) return { landlordId: l.id, landlordName: l.name, source: 'reviews' };
  }

  return null;
}

// This avoids incorrect property-to-landlord mappings.
const SEED_PROPERTIES = [];

const SEED_REVIEWS = [];

// Neighborhood data — scores are computed live from user reviews
const HOOD_NAMES = ["Campustown","Lincoln Ave","South Campus","East Campus","North Champaign","Urbana"];
const HOOD_TYPES = { "Campustown":"Most Popular", "Lincoln Ave":"Residential", "South Campus":"Budget-Friendly",
  "East Campus":"Engineering Hub", "North Champaign":"Off the Beaten Path", "Urbana":"Alternative Vibe" };

function getHoodStats() {
  return HOOD_NAMES.map(name => {
    // Compute scores from Supabase reviews that have hood ratings
    const hoodReviews = dbReviews.filter(r => r.hoodName === name);

    const avg = (arr, key) => {
      const vals = arr.map(r => r[key]).filter(v => v && v > 0);
      return vals.length ? (vals.reduce((s,v)=>s+v,0)/vals.length) : 0;
    };

    // Avg rent comes ONLY from real reviews — no hardcoded prices
    const reviewRents = hoodReviews.map(r => r.monthlyRent).filter(v => v && isValidRent(v));
    const avgRent = reviewRents.length ? Math.round(reviewRents.reduce((s,v)=>s+v,0)/reviewRents.length) : 0;

    return {
      name: name,
      type: HOOD_TYPES[name],
      rent: avgRent,
      safety: parseFloat(avg(hoodReviews, 'hoodSafety').toFixed(1)),
      nightlife: parseFloat(avg(hoodReviews, 'hoodNightlife').toFixed(1)),
      quiet: parseFloat(avg(hoodReviews, 'hoodQuiet').toFixed(1)),
      walk: parseFloat(avg(hoodReviews, 'hoodWalkability').toFixed(1)),
      reviewCount: hoodReviews.length
    };
  });
}

// The API returns at most 1,000 rows per request: read page by page (stable order: day, then id)
async function fetchAllRows(table) {
  const PAGE = 1000, rows = [];
  let count = null;
  for (let from = 0; from < 50000; from += PAGE) {
    const res = await db.from(table).select('*', from === 0 ? { count: 'exact' } : undefined)
      .order('created_at', { ascending: false }).order('id', { ascending: true }).range(from, from + PAGE - 1);
    if (res.error) return { error: res.error };
    if (from === 0) count = res.count;
    rows.push(...(res.data || []));
    if (!res.data || res.data.length < PAGE) break;
  }
  return { data: rows, count };
}

async function loadDbReviews() {
  try {
    let { data, error, count } = await fetchAllRows('reviews_public');
    if (dbObjectMissing(error)) ({ data, error, count } = await fetchAllRows('reviews'));
    if (error) throw error;
    console.log('[RateMyCrib] Supabase returned', (data||[]).length, 'reviews (count:', count, ')');
    if (data && data.length === 0 && count === 0) {
      console.warn('[RateMyCrib] 0 reviews returned — if you have reviews in the DB, check that RLS has a SELECT policy for anon role');
    }
    dbReviews = (data || []).map(r => ({
      id: r.id,
      landlordId: LANDLORD_ALIASES[r.landlord_id] || r.landlord_id, // merged landlords count once, everywhere
      landlordName: r.landlord_name || '',
      property: r.property || 'Not specified',
      author: r.author || 'Anonymous Student',
      date: new Date(r.created_at).toLocaleDateString('en-US', {month:'short', year:'numeric'}),
      createdAt: new Date(r.created_at).getTime(),
      rating: parseFloat(r.rating),
      wouldRent: r.would_rent,

      helpful: r.helpful_count || 0,

      hoodSafety: r.hood_safety || 0,

      scoreFairness: r.score_fairness || 0,
      scoreMoveOut: r.score_move_out || 0,
      depositBack: r.deposit_back || null,
    }));
    dbLoaded = true;
    dbLoadError = false; _dbRetries = 0;
    render();
  } catch (e) {
    console.error('[RateMyCrib] Supabase load failed:', e && e.message);
    dbLoaded = true;

    render();
    // Try again on its own a few times (2s, 6s, 18s), then leave it to the Try again button
    if (_dbRetries < 3) { const wait = 2000 * Math.pow(3, _dbRetries++); setTimeout(() => { if (dbLoadError) loadDbReviews(); }, wait); }
  }
}

// Lease terms for the review form, newest first: Jan–Apr starts Spring, May–Jul Summer, Aug–Dec Fall.
// Starts run to the current term; ends run a year past it (a current lease ends later).
const LEASE_SEASONS = ['Spring', 'Summer', 'Fall'];
function leaseTermList(kind) {
  const now = new Date(), m = now.getMonth();
  let y = now.getFullYear(), s = m < 4 ? 0 : m < 7 ? 1 : 2;
  if (kind === 'end') { s += 3; y += Math.floor(s / 3); s %= 3; }
  const out = [];
  while (y > 2014 || (y === 2014 && s === 2)) { out.push(LEASE_SEASONS[s] + ' ' + y); if (--s < 0) { s = 2; y--; } }
  return out;
}
function leaseTermIndex(t) {
  const m = /^(Spring|Summer|Fall) (\d{4})$/.exec(t || '');
  return m ? Number(m[2]) * 3 + LEASE_SEASONS.indexOf(m[1]) : -1;
}

// One review per lease from this browser. Stored as short scrambled codes (landlord + lease start), so a
// glance at this browser's storage doesn't list the landlords you reviewed. The database checks verified
// reviews on its own; anonymous ones have nothing else to check against.
function leaseKey(landlordId, landlordName, term) {
  const who = landlordId > 0 ? 'id:' + landlordId : 'name:' + String(landlordName || '').trim().toLowerCase();
  const s = 'rmc-lease|' + who + '|' + String(term || '').toLowerCase();
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(36);
}
function loadReviewedLeases() {
  try { const v = JSON.parse(localStorage.getItem('rmc_reviewed_leases') || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; }

// Mailing list sign-up. The database records where they signed up and the exact wording shown (proof of consent),
// never says whether the address was already listed, and never re-subscribes someone who unsubscribed.
async function joinList(email, source) {
  let res;
  try { res = await db.rpc('rmc_join_list', { p_email: email, p_source: source }); } catch (e) { res = { error: e }; }
  if (res && res.error && dbObjectMissing(res.error)) { // database not updated yet: older box
    try { res = await db.rpc('rmc_add_contact', { p_email: email }); } catch (e) { res = { error: e }; }
  }
  return !(res && res.error);
}
const EMAIL_RE = /^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i;
async function unlockWithEmail(form) {
  const input = form.querySelector('input[type=email]'), err = form.querySelector('.ue-err'), btn = form.querySelector('button');
  const v = (input.value || '').trim();
  if (!EMAIL_RE.test(v)) { err.textContent = 'Check your email address.'; err.hidden = false; input.focus(); return; }
  btn.disabled = true; err.hidden = true;
  const ok = await joinList(v, 'unlock');
  btn.disabled = false;
  if (!ok) { err.textContent = "Couldn't save that right now. Try again in a minute."; err.hidden = false; return; }
  try { localStorage.setItem('rmc_unlocked', '1'); } catch (e) {}
  trackEvent('reviews_unlock', { method: 'email' });
  toast('All reviews unlocked. Every email we send has an unsubscribe link.');
  render();
}

// Dynamically compute landlord stats from real Supabase reviews
function getLandlordStats(landlord) {
  const revs = getReviewsForLandlord(landlord);
  if (revs.length === 0) {

      scores:{maintenance:0,communication:0,fairness:0,moveOut:0}, dist:[0,0,0,0,0] };
  }
  const avg = revs.reduce((s,r) => s + r.rating, 0) / revs.length;
  const wouldRentPct = Math.round(revs.filter(r => r.wouldRent).length / revs.length * 100);
  const dist = [0,0,0,0,0];
  revs.forEach(r => {

// Compute a stock-style trend for a landlord
function getLandlordTrend(l) {
  var revs = getReviewsForLandlord(l);
  if (revs.length < 2) return { arrow: '', label: '', color: '', diff: 0, points: [] };
  // Sort chronologically (oldest first) using createdAt
  var sorted = revs.slice().sort(function(a,b){ return (a.createdAt||0) - (b.createdAt||0); });
  var points = sorted.map(function(r){ return r.rating; });
  // Compare first half avg to second half avg
  var half = Math.floor(sorted.length / 2);
  var older = sorted.slice(0, half);
  var newer = sorted.slice(half);
  var olderAvg = older.reduce(function(s,r){return s+r.rating;},0) / older.length;
  var newerAvg = newer.reduce(function(s,r){return s+r.rating;},0) / newer.length;
  var diff = newerAvg - olderAvg;
  var arrow, label, color;
  if (diff > 0.3) { arrow = '▲'; label = '+' + diff.toFixed(1); color = '#16A34A'; }
  else if (diff < -0.3) { arrow = '▼'; label = diff.toFixed(1); color = '#DC2626'; }
  else { arrow = '—'; label = '0.0'; color = 'var(--muted)'; }
  return { arrow: arrow, label: label, color: color, diff: diff, points: points };
}

// Generate an SVG sparkline from an array of values
function sparklineSVG(points, w, h, color) {
  if (!points || points.length < 2) return '';
  var min = Math.min.apply(null, points);
  var max = Math.max.apply(null, points);
  var range = max - min || 1;
  var pad = 2;
  var coords = points.map(function(v, i) {
    var x = pad + (i / (points.length - 1)) * (w - pad * 2);
    var y = pad + (1 - (v - min) / range) * (h - pad * 2);
    return x.toFixed(1) + ',' + y.toFixed(1);
  });
  return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" style="display:block">' +
    '<polyline points="' + coords.join(' ') + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<circle cx="' + coords[coords.length-1].split(',')[0] + '" cy="' + coords[coords.length-1].split(',')[1] + '" r="3" fill="' + color + '"/>' +
  '</svg>';
}

    { tag: 'Noisy', type: 'warn', keys: ['very noisy','really loud','too loud','thin walls','hear everything','loud neighbor'], min: 0.35, minN: 2 },
    { tag: 'Great Location', type: 'good', keys: ['great location','close to campus','walking distance','convenient location','prime location','close to everything','steps from'], min: 0.4, minN: 2 },
    { tag: 'Parking Hassle', type: 'warn', keys: ['no parking','hard to park','towed','parking.*terrible','parking.*issue','parking.*problem','parking.*nightmare'], min: 0.35, minN: 2 },
    { tag: 'Security Deposit Issues', type: 'bad', keys: ['kept.*deposit','didn.t return.*deposit','unfair charge','hidden fee','nickel and dime','charged.*move.out','deposit.*never'], min: 0.3, minN: 2, scoreKey: 'moveOut', scoreMax: 2.8 },
    { tag: 'Pet Friendly', type: 'neutral', keys: ['pet.friendly','pets allowed','dog friendly','cat friendly','allows pets'], min: 0.3, minN: 2 },
    { tag: 'Good for Grad Students', type: 'neutral', keys: ['grad student','graduate student','quiet.*study','mature crowd','older crowd'], min: 0.35, minN: 2 },
  ];

  patterns.forEach(function(p) {
    // Score gate: if a score dimension is specified, the actual score must back up the keyword
    if (p.scoreKey && stats.scores[p.scoreKey] > 0) {
      if (p.scoreMin && stats.scores[p.scoreKey] < p.scoreMin) return;
      if (p.scoreMax && stats.scores[p.scoreKey] > p.scoreMax) return;
    }
    var matchCount = 0;
    texts.forEach(function(t) {
      var found = p.keys.some(function(k) { return new RegExp(k, 'i').test(t); });
      if (found) matchCount++;
    });
    if (matchCount >= p.minN && matchCount / n >= p.min) {
      tags.push({ tag: p.tag, type: p.type, pct: Math.round(matchCount / n * 100) });
    }
  });

  // Score-based tags — require minimum 3 reviews for credibility
  if (stats.scores.maintenance >= 4.0 && stats.reviews >= 3) tags.push({ tag: 'Top Maintenance', type: 'good', pct: null });
  if (stats.scores.communication >= 4.0 && stats.reviews >= 3) tags.push({ tag: 'Top Communication', type: 'good', pct: null });
  if (stats.scores.fairness >= 4.0 && stats.reviews >= 3) tags.push({ tag: 'Very Fair', type: 'good', pct: null });
  if (stats.wouldRent >= 80 && stats.reviews >= 4) tags.push({ tag: 'Most Would Rent Again', type: 'good', pct: null });
  if (stats.wouldRent <= 25 && stats.reviews >= 4) tags.push({ tag: 'Few Would Rent Again', type: 'bad', pct: null });

  // Deduplicate by tag name, keep first occurrence (highest confidence)
  var seen = {};
  return tags.filter(function(t) { if (seen[t.tag]) return false; seen[t.tag] = true; return true; }).slice(0, 6);
}

function renderSmartTags(landlord) {
  var tags = getSmartTags(landlord);
  if (tags.length === 0) return '';
  // Summaries of what reviewers wrote and rated, labeled as such
  return '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px"><span class="smart-tag-lead">What reviewers mention:</span>' +
    tags.map(function(t) {
      var icon = t.type === 'good' ? '&#10003;' : t.type === 'bad' ? '&#10007;' : t.type === 'warn' ? '&#9888;' : '&#8226;';
      var why = t.pct ? 'Mentioned in ' + t.pct + '% of reviews' : 'Based on reviewers\' ratings';
      return '<span class="smart-tag smart-tag-' + t.type + '" title="' + why + '">' + icon + ' ' + esc(t.tag) + '</span>';
    }).join('') +
  '</div>';
}

// ===== HEAD-TO-HEAD COMPARISON =====
function HeadToHead() {
  var allStats = SEED_LANDLORDS.map(getLandlordStats).concat(
    (userLandlords || []).map(function(ul) {
      return getLandlordStats({ id: ul.id, name: ul.name, props: 0, rating: 0, reviews: 0, wouldRent: 0, responseRate: "—", scores:{maintenance:0,communication:0,fairness:0,moveOut:0}, topTags:[], dist:[0,0,0,0,0] });
    })
  ).filter(function(l) { return l.reviews > 0; }).sort(function(a,b) { return a.name.localeCompare(b.name); });

  if (allStats.length < 2) return '<div style="text-align:center;padding:48px 24px"><p style="color:var(--muted)">Need at least 2 reviewed landlords for comparison. Keep reviewing!</p></div>';

  var a = S.h2hA ? allStats.find(function(l){ return l.id === S.h2hA; }) : allStats[0];
  var b = S.h2hB ? allStats.find(function(l){ return l.id === S.h2hB; }) : (allStats.length > 1 ? allStats[1] : null);
  if (!a) a = allStats[0];
  if (!b || b.id === a.id) b = allStats.find(function(l){ return l.id !== a.id; });
  if (!a || !b) return '';

  var revsA = getReviewsForLandlord(a).filter(function(r){ return isValidRent(r.monthlyRent); });
  var revsB = getReviewsForLandlord(b).filter(function(r){ return isValidRent(r.monthlyRent); });
  var rentA = revsA.length ? Math.round(revsA.reduce(function(s,r){return s+r.monthlyRent;},0)/revsA.length) : 0;
  var rentB = revsB.length ? Math.round(revsB.reduce(function(s,r){return s+r.monthlyRent;},0)/revsB.length) : 0;
  // Trends need MIN_TREND_REVIEWS; with fewer, one review swings the line
  var noTrend = { arrow: '', label: 'Too few reviews', color: '', diff: 0, points: [] };
  var trendA = a.reviews >= MIN_TREND_REVIEWS ? getLandlordTrend(a) : noTrend;
  var trendB = b.reviews >= MIN_TREND_REVIEWS ? getLandlordTrend(b) : noTrend;

  function win(va, vb, higher) {
    if (va === 0 && vb === 0) return ['',''];
    if (va === 0) return ['h2h-loser','h2h-winner'];
    if (vb === 0) return ['h2h-winner','h2h-loser'];
    if (higher) return va > vb ? ['h2h-winner','h2h-loser'] : va < vb ? ['h2h-loser','h2h-winner'] : ['',''];
    return va < vb ? ['h2h-winner','h2h-loser'] : va > vb ? ['h2h-loser','h2h-winner'] : ['',''];
  }

  var rows = [
    { label: 'Overall Rating', va: a.rating.toFixed(1), vb: b.rating.toFixed(1), w: win(a.rating, b.rating, true) },
    { label: 'Would Rent Again', va: a.wouldRent + '%', vb: b.wouldRent + '%', w: win(a.wouldRent, b.wouldRent, true) },
    { label: 'Avg Rent', va: rentA ? '$' + rentA : '—', vb: rentB ? '$' + rentB : '—', w: win(rentA, rentB, false) },
    { label: 'Maintenance', va: a.scores.maintenance > 0 ? a.scores.maintenance.toFixed(1) : '—', vb: b.scores.maintenance > 0 ? b.scores.maintenance.toFixed(1) : '—', w: win(a.scores.maintenance, b.scores.maintenance, true) },
    { label: 'Communication', va: a.scores.communication > 0 ? a.scores.communication.toFixed(1) : '—', vb: b.scores.communication > 0 ? b.scores.communication.toFixed(1) : '—', w: win(a.scores.communication, b.scores.communication, true) },
    { label: 'Fairness', va: a.scores.fairness > 0 ? a.scores.fairness.toFixed(1) : '—', vb: b.scores.fairness > 0 ? b.scores.fairness.toFixed(1) : '—', w: win(a.scores.fairness, b.scores.fairness, true) },
    { label: 'Move-Out', va: a.scores.moveOut > 0 ? a.scores.moveOut.toFixed(1) : '—', vb: b.scores.moveOut > 0 ? b.scores.moveOut.toFixed(1) : '—', w: win(a.scores.moveOut, b.scores.moveOut, true) },
    { label: 'Reviews', va: String(a.reviews), vb: String(b.reviews), w: win(a.reviews, b.reviews, true) },
    { label: 'Trend', va: trendA.arrow + ' ' + trendA.label, vb: trendB.arrow + ' ' + trendB.label, w: ['',''] },
  ];

  // Count row wins (for display)
  var winsA = 0, winsB = 0;
  rows.forEach(function(r) { if (r.w[0] === 'h2h-winner') winsA++; if (r.w[1] === 'h2h-winner') winsB++; });

  // Composite score: weighted combination of all metrics (0-100 scale)
  // Rating (30%) + Would Rent Again (25%) + Maintenance (12%) + Communication (12%) + Fairness (12%) + Move-Out (9%)
  function compositeScore(l) {
    var r = (l.rating / 5) * 100;           // normalize 0-5 → 0-100
    var wr = l.wouldRent;                    // already 0-100
    var m = (l.scores.maintenance / 5) * 100;
    var c = (l.scores.communication / 5) * 100;
    var f = (l.scores.fairness / 5) * 100;
    var mo = (l.scores.moveOut / 5) * 100;
    return Math.round(r * 0.30 + wr * 0.25 + m * 0.12 + c * 0.12 + f * 0.12 + mo * 0.09);
  }
  var scoreA = compositeScore(a);
  var scoreB = compositeScore(b);

  var opts = allStats.map(function(l) {
    return '<option value="' + l.id + '">' + esc(l.name) + ' (' + l.rating.toFixed(1) + ')</option>';
  }).join('');

  var h2hShareText = (scoreA > scoreB ? a.name + ' beats ' + b.name : scoreB > scoreA ? b.name + ' beats ' + a.name : a.name + ' vs ' + b.name + ' — dead even') +
    ' (' + scoreA + '-' + scoreB + ') on RateMyCrib. Compare your UIUC landlords: https://ratemycrib.net/#h2h';
  return '<div class="h2h-picker">' +
    '<select class="h2h-select" aria-label="First landlord" onchange="go({h2hA:parseInt(this.value)})" value="' + a.id + '">' + opts.replace('value="' + a.id + '"', 'value="' + a.id + '" selected') + '</select>' +
    '<span class="h2h-vs">VS</span>' +
    '<select class="h2h-select" aria-label="Second landlord" onchange="go({h2hB:parseInt(this.value)})" value="' + b.id + '">' + opts.replace('value="' + b.id + '"', 'value="' + b.id + '" selected') + '</select>' +
  '</div>' +
  '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;text-align:center">' +
    '<div style="padding:20px;background:var(--card-bg);border-radius: 2px;border:1px solid var(--border)">' +
      '<div style="font-size:32px;font-weight:900;color:' + (a.rating >= 3.5 ? 'var(--rate-great-text)' : a.rating >= 2.5 ? 'var(--rate-mixed-text)' : 'var(--rate-poor-text)') + '">' + a.rating.toFixed(1) + '</div>' +
      '<div style="font-size:15px;font-weight:700;margin-top:4px;color:var(--text)">' + esc(a.name) + '</div>' +
      '<div style="font-size:12px;color:var(--muted);margin-top:2px">' + a.reviews + ' reviews</div>' +
      (trendA.points.length >= 2 ? '<div style="margin-top:8px;display:flex;justify-content:center">' + sparklineSVG(trendA.points, 80, 24, trendA.color) + '</div>' : '') +
      renderSmartTags(a) +
    '</div>' +
    '<div style="padding:20px;background:var(--card-bg);border-radius: 2px;border:1px solid var(--border)">' +
      '<div style="font-size:32px;font-weight:900;color:' + (b.rating >= 3.5 ? 'var(--rate-great-text)' : b.rating >= 2.5 ? 'var(--rate-mixed-text)' : 'var(--rate-poor-text)') + '">' + b.rating.toFixed(1) + '</div>' +
      '<div style="font-size:15px;font-weight:700;margin-top:4px;color:var(--text)">' + esc(b.name) + '</div>' +
      '<div style="font-size:12px;color:var(--muted);margin-top:2px">' + b.reviews + ' reviews</div>' +
      (trendB.points.length >= 2 ? '<div style="margin-top:8px;display:flex;justify-content:center">' + sparklineSVG(trendB.points, 80, 24, trendB.color) + '</div>' : '') +
      renderSmartTags(b) +
    '</div>' +
  '</div>' +
  '<div style="background:var(--card-bg);border-radius: 2px;border:1px solid var(--border);padding:4px 20px;margin-bottom:24px">' +
    rows.map(function(r) {
      return '<div class="h2h-row">' +
        '<div class="h2h-val ' + r.w[0] + '">' + r.va + '</div>' +
        '<div class="h2h-label">' + r.label + '</div>' +
        '<div class="h2h-val ' + r.w[1] + '">' + r.vb + '</div>' +
      '</div>';
    }).join('') +
  '</div>' +
  '<div style="text-align:center;padding:24px;background:var(--card-bg);border-radius: 2px;border:1px solid var(--border);animation:verdictPop 0.5s ease both">' +
    '<div style="font-size:56px;margin-bottom:12px;display:inline-block;animation:' + (scoreA > scoreB ? 'tiltLeft' : scoreB > scoreA ? 'tiltRight' : 'tiltEven') + ' 3s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.3s both">&#9878;</div>' +
    '<div style="animation:verdictReveal 0.4s ease 3.2s both">' +
      '<div style="display:flex;justify-content:center;align-items:center;gap:24px;margin-bottom:12px">' +
        '<div style="text-align:center"><div style="font-size:28px;font-weight:900;color:' + (scoreA > scoreB ? '#16A34A' : scoreA < scoreB ? 'var(--muted)' : 'var(--text)') + '">' + scoreA + '</div><div style="font-size:11px;color:var(--muted)">' + esc(a.name) + '</div></div>' +
        '<div style="font-size:12px;font-weight:700;color:var(--muted)">vs</div>' +
        '<div style="text-align:center"><div style="font-size:28px;font-weight:900;color:' + (scoreB > scoreA ? '#16A34A' : scoreB < scoreA ? 'var(--muted)' : 'var(--text)') + '">' + scoreB + '</div><div style="font-size:11px;color:var(--muted)">' + esc(b.name) + '</div></div>' +
      '</div>' +
      (scoreA > scoreB ? '<strong style="color:var(--good-text);font-size:16px">Reviewers rate ' + esc(a.name) + ' higher</strong>' :
       scoreB > scoreA ? '<strong style="color:var(--good-text);font-size:16px">Reviewers rate ' + esc(b.name) + ' higher</strong>' :
       '<strong style="color:var(--muted);font-size:16px">Dead even</strong>') +
      '<div style="font-size:11px;color:var(--muted);margin-top:8px">Composite score combining rating, would-rent-again %, and all sub-scores</div>' +
    '</div>' +
  '</div>' +

  // Shareable comparison card
  '<div id="h2h-share-card" style="margin-top:20px;padding:24px;background:#13294B;border-radius: 2px;border:1px solid #22385F;text-align:center;animation:verdictReveal 0.4s ease 3.5s both">' +
    '<div style="display:flex;justify-content:center;align-items:center;gap:20px;margin-bottom:12px">' +
      '<div style="text-align:center"><div style="font-size:22px;font-weight:900;color:' + (scoreA >= scoreB ? '#FF5F05' : '#B7BFCB') + '">' + esc(a.name) + '</div><div style="font-size:32px;font-weight:900;color:white">' + scoreA + '</div><div style="font-size:12px;color:#B7BFCB">' + a.rating.toFixed(1) + ' rating · ' + a.wouldRent + '% rent again</div></div>' +
      '<div style="font-size:14px;font-weight:800;color:#B7BFCB">vs</div>' +
      '<div style="text-align:center"><div style="font-size:22px;font-weight:900;color:' + (scoreB >= scoreA ? '#FF5F05' : '#B7BFCB') + '">' + esc(b.name) + '</div><div style="font-size:32px;font-weight:900;color:white">' + scoreB + '</div><div style="font-size:12px;color:#B7BFCB">' + b.rating.toFixed(1) + ' rating · ' + b.wouldRent + '% rent again</div></div>' +
    '</div>' +

    '</div>' +
  '</div>';
}

function MapView() {
  // Collect landlords with hood data from reviews
  var allRevs = allReviews();
  var hoodMap = Object.create(null); // keyed by text students typed: no inherited keys like "constructor"
  allRevs.forEach(function(r) {
    if (!r.hoodName) return;
    if (!hoodMap[r.hoodName]) hoodMap[r.hoodName] = { name: r.hoodName, ratings: [], rents: [], landlords: Object.create(null) };
    hoodMap[r.hoodName].ratings.push(r.rating);
    if (isValidRent(r.monthlyRent)) hoodMap[r.hoodName].rents.push(r.monthlyRent);
    var lName = r.landlordName || 'Unknown';
    hoodMap[r.hoodName].landlords[lName] = (hoodMap[r.hoodName].landlords[lName] || 0) + 1;
  });

  var hoods = Object.values(hoodMap).filter(function(h) { return h.ratings.length > 0; });
  if (hoods.length < 2) return '<div style="text-align:center;padding:48px 24px"><p style="color:var(--muted)">Not enough neighborhood data yet. Reviews with neighborhood info will populate this map.</p></div>';

  // Compute hood stats
  hoods.forEach(function(h) {
    h.avgRating = h.ratings.reduce(function(s,v){return s+v;},0) / h.ratings.length;
    h.avgRent = h.rents.length ? Math.round(h.rents.reduce(function(s,v){return s+v;},0) / h.rents.length) : 0;
    h.count = h.ratings.length;
    h.topLandlord = Object.entries(h.landlords).sort(function(a,b){return b[1]-a[1];})[0][0];
  });

  // Build the map as a styled div with pin overlays
  var pins = hoods.map(function(h) {
    var coords = HOOD_COORDS[h.name] || { x: 50 + (Math.random() - 0.5) * 40, y: 40 + (Math.random() - 0.5) * 30 };
    var color = h.avgRating >= 3.5 ? '#16A34A' : h.avgRating >= 2.5 ? '#EAB308' : '#DC2626';
    var size = Math.max(26, Math.min(40, 20 + h.count * 2));
    return '<div class="map-pin" style="left:' + coords.x + '%;top:' + coords.y + '%;width:' + size + 'px;height:' + size + 'px;background:' + color + '" onclick="go({page:\'home\',hoodFilter:' + jsArg(h.name) + '})">' +
      h.avgRating.toFixed(1) +
      '<div class="map-tooltip">' +
        '<div style="font-size:14px;font-weight:800;margin-bottom:4px">' + esc(h.name) + '</div>' +
        '<div>' + h.avgRating.toFixed(1) + ' avg rating &middot; ' + h.count + ' reviews</div>' +
        (h.avgRent ? '<div>~$' + h.avgRent + '/mo avg rent</div>' : '') +
        '<div style="color:var(--muted);font-size:11px;margin-top:2px">Top: ' + esc(h.topLandlord) + '</div>' +
      '</div>' +
    '</div>';
  }).join('');

  return '<div class="map-wrap">' +
    '<div style="position:relative;width:100%;padding-bottom:65%;background:linear-gradient(135deg, var(--light) 0%, var(--card-bg) 100%)">' +
      '<div style="position:absolute;inset:0;overflow:hidden">' +
        // Grid lines for campus feel
        '<div style="position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px, transparent 1px),linear-gradient(90deg, var(--border) 1px, transparent 1px);background-size:50px 50px;opacity:0.4"></div>' +
        // Campus label
        '<div style="position:absolute;top:25%;left:50%;transform:translate(-50%,-50%);font-size:11px;font-weight:700;color:var(--muted);opacity:0.5;letter-spacing:2px;text-transform:uppercase">UIUC CAMPUS</div>' +
        '<div style="position:absolute;top:30%;left:35%;right:35%;height:20%;border:2px dashed var(--border);border-radius: 2px;opacity:0.3"></div>' +
        pins +
      '</div>' +
    '</div>' +
    '<div style="padding:12px 16px;display:flex;justify-content:center;gap:16px;font-size:12px;border-top:1px solid var(--border)">' +
      '<span><span style="display:inline-block;width:10px;height:10px;border-radius:0;background:#16A34A;margin-right:4px"></span>3.5+ stars</span>' +
      '<span><span style="display:inline-block;width:10px;height:10px;border-radius:0;background:#EAB308;margin-right:4px"></span>2.5-3.4</span>' +
      '<span><span style="display:inline-block;width:10px;height:10px;border-radius:0;background:#DC2626;margin-right:4px"></span>Below 2.5</span>' +
      '<span style="color:var(--muted)">Bigger = more reviews</span>' +
    '</div>' +
  '</div>';
}

// ===== ENHANCED SHARE FLOW =====
function shareWithRoommates(name) {
  var url = 'https://ratemycrib.net/?ref=roommate#landlord/' + slugForName(name) + '/rate';

  trackEvent('roommate_share', { method: navigator.share ? 'native' : 'copy' });

  try { navigator.clipboard.writeText(full).then(function () { toast('Copied. Paste it in your roommate group chat.'); }, function () { toast(full); }); } catch (e) { toast(full); }
}
function showSharePromptEnhanced(landlordName, review, live) {
  var lName = landlordName || '';
  var shareUrl = 'https://ratemycrib.net';
  var shareText = lName
    ? 'I just reviewed ' + lName + ' on RateMyCrib — the honest guide to UIUC housing. Check it out:'
    : 'I just reviewed my landlord on RateMyCrib — the honest guide to UIUC housing. Check it out:';
  var encodedText = encodeURIComponent(shareText + ' ' + shareUrl);
  var encodedUrl = encodeURIComponent(shareUrl);

  // Build "Your Experience vs Average" card
  var comparisonHtml = '';
  if (review && review.landlordId) {
    var landlord = findLandlord(review.landlordId);
    if (landlord) {
      var stats = getLandlordStats(landlord);
      if (stats.reviews > 1) {
        var diff = (review.rating - stats.rating).toFixed(1);
        var diffNum = parseFloat(diff);
        var diffColor = diffNum > 0.3 ? '#16A34A' : diffNum < -0.3 ? '#DC2626' : 'var(--muted)';
        var diffLabel = diffNum > 0.3 ? 'above' : diffNum < -0.3 ? 'below' : 'right at';
        var diffSign = diffNum > 0 ? '+' : '';
        comparisonHtml =
          '<div style="background:var(--light);border:1px solid var(--border);border-radius: 2px;padding:16px;margin-bottom:20px;text-align:left">' +
            '<div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px">Your Experience vs Average</div>' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">' +
              '<span style="font-size:13px;color:var(--text)">Your Rating</span>' +
              '<span style="font-size:15px;font-weight:800;color:var(--text)">' + review.rating.toFixed(1) + '</span>' +
            '</div>' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">' +
              '<span style="font-size:13px;color:var(--text)">' + esc(lName) + ' Average</span>' +
              '<span style="font-size:15px;font-weight:800;color:var(--text)">' + stats.rating.toFixed(1) + '</span>' +
            '</div>' +
            '<div style="border-top:1px solid var(--border);padding-top:8px;text-align:center">' +
              '<span style="font-size:14px;font-weight:800;color:' + diffColor + '">' + diffSign + diff + '</span>' +
              '<span style="font-size:12px;color:var(--muted);margin-left:6px">Your experience was ' + diffLabel + ' average</span>' +
            '</div>' +
          '</div>';
      }
    }
  }

  // Roommates shared the lease, so they can review the same landlord; ask while the reviewer is still here
  var roommateHtml = '';
  if (lName) {
    var rl = review && review.landlordId ? findLandlord(review.landlordId) : null;
    var have = rl ? getLandlordStats(rl).reviews : 0;
    var need = Math.max(0, MIN_LABEL_REVIEWS - have);
    roommateHtml =
      '<div class="roommate-box"><p><strong>Lived with roommates?</strong> They can review ' + esc(lName) + ' too' +
        (need ? ', and ' + need + ' more review' + (need !== 1 ? 's' : '') + ' gives it a full rating.' : '.') + '</p>' +
      '<button class="roommate-btn" onclick="shareWithRoommates(' + jsArg(lName) + ')">Send this to my roommates</button></div>';
  }

  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:300;animation:fadeIn 0.2s';
  overlay.innerHTML =
    '<div style="background:var(--card-bg,#fff);border-radius: 2px;padding:32px 28px;max-width:420px;width:92%;text-align:center;animation:slideDown 0.3s;box-shadow:0 20px 60px rgba(0,0,0,0.3);border:1px solid var(--border)">' +
      '<h3 style="font-size:22px;font-weight:900;margin-bottom:6px;letter-spacing:-0.3px;color:var(--text)">Thanks, that helps the next class.</h3>' +
      '<p style="font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:16px">' + (live === false ? 'Your review is in. It will appear after a quick check (we hold reviews with contact details, repeats or a sudden burst for a person to look at).' : 'Your review is in.') + '</p>' +
      roommateHtml +
      '<button class="second-review-btn" onclick="trackEvent(\'second_review_click\');this.closest(\'div\').parentElement.remove();go({page:\'home\',detail:null,modal:true,stars:0,wouldRentChoice:null,posTags:[],negTags:[],formData:{}})">Rented somewhere else before? Review that landlord</button>' +
      comparisonHtml +
      '<p style="font-size:13px;font-weight:700;color:var(--text);margin:4px 0 10px">Or send RateMyCrib to someone picking a place</p>' +
      '<div class="share-btn-row">' +
        '<button class="share-opt" onclick="trackEvent(\'share_click\',{method:\'sms\'});window.open(' + jsArg('sms:?&body=' + encodedText) + ',\'_blank\')"><div class="share-opt-icon" style="font-weight:700">SMS</div><div class="share-opt-label">iMessage</div></button>' +
        '<button class="share-opt" onclick="trackEvent(\'share_click\',{method:\'twitter\'});window.open(' + jsArg('https://twitter.com/intent/tweet?text=' + encodedText) + ',\'_blank\')"><div class="share-opt-icon" style="font-weight:700">X</div><div class="share-opt-label">Twitter</div></button>' +
        '<button class="share-opt" onclick="trackEvent(\'share_click\',{method:\'copy_link\'});copyShareLink();this.querySelector(\'.share-opt-label\').textContent=\'Copied!\'"><div class="share-opt-icon" style="font-weight:700">Link</div><div class="share-opt-label">Copy Link</div></button>' +
      '</div>' +
      (navigator.share ? '<button onclick="navigator.share({title:\'RateMyCrib\',text:' + jsArg(shareText) + ',url:' + jsArg(shareUrl) + '}).catch(function(){});this.textContent=\'Shared!\'" style="width:100%;padding:13px;background:transparent;color:var(--text);border:1.5px solid var(--border);border-radius: 2px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:12px">Share via...</button>' : '') +
      '<button onclick="this.closest(\'div\').parentElement.remove()" style="width:100%;padding:12px;background:transparent;color:var(--muted);border:none;font-size:14px;cursor:pointer;font-family:inherit;font-weight:500;margin-top:6px">Maybe later</button>' +
    '</div>';
  overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
  document.body.appendChild(overlay);
}

function toggleDarkMode() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const newTheme = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  try { localStorage.setItem('rmc-theme', newTheme); } catch(e) {}
  // No render() needed — CSS handles everything via [data-theme] selectors
  // Just swap the toggle button icon (sun ↔ moon)
  var btn = document.querySelector('.dm-toggle');
  if (btn) btn.innerHTML = newTheme === 'dark' ? '&#9788;' : '&#9790;';
  trackEvent('dark_mode_toggle', { theme: newTheme });
}

function LandlordTicker() {
  // Build stock-ticker items for every landlord with reviews
  const allLandlords = [
    ...SEED_LANDLORDS.map(getLandlordStats),
    ...(userLandlords || []).map(ul => getLandlordStats({ id: ul.id, name: ul.name, props: 0, rating: 0, reviews: 0, wouldRent: 0, responseRate: "—", scores:{maintenance:0,communication:0,fairness:0,moveOut:0}, topTags:[], dist:[0,0,0,0,0] }))
  ].filter(l => l.reviews > 0);

  if (allLandlords.length === 0) return '';

  // Sort by review count desc so the most-reviewed landlords show first
  allLandlords.sort((a, b) => b.reviews - a.reviews);

  // Build ticker items — each landlord looks like: GSR 3.8 ▲ (12)
  const items = allLandlords.map(l => {
    const r = l.rating.toFixed(1);
    const colorClass = l.reviews < MIN_LABEL_REVIEWS ? 'neutral' : l.rating >= 3.5 ? 'green' : l.rating >= 2.5 ? 'yellow' : 'red';

    // Trend: compare last 3 reviews avg vs overall avg to simulate movement
    const revs = getReviewsForLandlord(l);
    const recentCount = Math.min(3, revs.length);
    const recentAvg = revs.slice(0, recentCount).reduce((s, rv) => s + rv.rating, 0) / recentCount;
    const diff = recentAvg - l.rating;
    let arrow = '', arrowClass = 'flat';
    if (l.reviews >= MIN_TREND_REVIEWS) {
      arrow = '—';
      if (diff > 0.15) { arrow = '▲'; arrowClass = 'up'; }
      else if (diff < -0.15) { arrow = '▼'; arrowClass = 'down'; }
    }

    // Abbreviate long names for ticker
    const abbrev = l.name.length > 18 ? l.name.substring(0, 16) + '…' : l.name;

    return `<div class="ticker-item" onclick="go({page:'detail',detail:${l.id}})">
      <span class="ticker-name">${esc(abbrev)}</span>
      <span class="ticker-rating ${colorClass}">${r}</span>
      ${arrow ? `<span class="ticker-arrow ${arrowClass}">${arrow}</span>` : ''}
      <span class="ticker-reviews">(${l.reviews})</span>
    </div>`;
  }).join('');

  // Duplicate the items so the scroll loops seamlessly
  const speed = Math.max(25, allLandlords.length * 4); // ~4s per landlord
  return `<div class="ticker-wrap" style="--ticker-duration:${speed}s">
    <div class="ticker-track">${items}${items}</div>
  </div>`;
}

function RentVsRatingChart() {
  // Collect landlords with both rating and rent data
  const allStats = [
    ...SEED_LANDLORDS.map(getLandlordStats),
    ...(userLandlords || []).map(ul => getLandlordStats({ id: ul.id, name: ul.name, props: 0, rating: 0, reviews: 0, wouldRent: 0, responseRate: "—", scores:{maintenance:0,communication:0,fairness:0,moveOut:0}, topTags:[], dist:[0,0,0,0,0] }))
  ];

  const data = allStats.filter(l => {
    if (l.reviews === 0) return false;
    const revs = getReviewsForLandlord(l).filter(r => isValidRent(r.monthlyRent));
    return revs.length > 0;
  }).map(l => {
    const revs = getReviewsForLandlord(l).filter(r => isValidRent(r.monthlyRent));
    const avgRent = Math.round(revs.reduce((s,r) => s + r.monthlyRent, 0) / revs.length);
    return { id: l.id, name: l.name, rating: l.rating, rent: avgRent, reviews: l.reviews, wouldRent: l.wouldRent };
  });

  if (data.length < 3) return ''; // Need at least 3 landlords with rent data

  // Responsive dimensions
  var isMobile = window.innerWidth < 700;
  var chartH = isMobile ? 300 : 420;
  var padL = isMobile ? 12 : 48;
  var padR = isMobile ? 6 : 24;
  var padT = isMobile ? 24 : 32;
  var padB = isMobile ? 36 : 48;

  // Dynamic axis ranges based on actual data with breathing room
  var rents = data.map(function(d){ return d.rent; });
  var ratings = data.map(function(d){ return d.rating; });
  var minRent = Math.floor((Math.min.apply(null, rents) - 75) / 50) * 50;
  var maxRent = Math.ceil((Math.max.apply(null, rents) + 75) / 50) * 50;
  var minRating = Math.max(0.5, Math.floor(Math.min.apply(null, ratings) * 2 - 1) / 2);
  var maxRating = Math.min(5.5, Math.ceil(Math.max.apply(null, ratings) * 2 + 1) / 2);

  // Helpers to convert data to position
  function xPos(rent) { return padL + (rent - minRent) / (maxRent - minRent) * (100 - padL - padR); }
  function yPos(rating) { return padT + (1 - (rating - minRating) / (maxRating - minRating)) * (chartH - padT - padB); }

  // Average crosshair
  var avgRent = Math.round(data.reduce(function(s,d){return s+d.rent;},0) / data.length);
  var avgRating = data.reduce(function(s,d){return s+d.rating;},0) / data.length;
  var hlList = S.highlightLandlords || [];
  var hasHL = hlList.length > 0;

  var dots = data.map(function(d) {
    var x = xPos(d.rent);
    var y = yPos(d.rating);
    var color = d.rating >= 3.5 ? '#16A34A' : d.rating >= 2.5 ? '#EAB308' : '#DC2626';
    var baseSize = isMobile ? Math.max(8, Math.min(14, 6 + d.reviews * 1.2)) : Math.max(12, Math.min(22, 8 + d.reviews * 1.8));
    var isHL = hasHL && hlList.indexOf(d.id) !== -1;
    var isDimmed = hasHL && !isHL;
    var size = isHL ? baseSize + 6 : baseSize;
    var opacity = isDimmed ? '0.15' : '1';
    var border = isHL ? '3px solid #fff' : '2px solid rgba(255,255,255,0.9)';
    var zIdx = isHL ? '5' : '2';
    var shadow = isHL ? '0 0 12px rgba(255,95,5,0.6)' : '0 1px 3px rgba(0,0,0,0.12)';
    // Tooltip alignment: left-align if dot is in right 30%, right-align if in left 30%, center otherwise
    var ttClass = x > 70 ? ' tt-right' : x < 30 ? ' tt-left' : '';
    return '<div class="scatter-dot' + ttClass + '" aria-label="' + esc(d.name + ': ' + d.rating.toFixed(1) + ' stars, $' + d.rent + ' a month. Open landlord page') + '" style="left:' + x + '%;top:' + y + 'px;width:' + size + 'px;height:' + size + 'px;background:' + color + ';opacity:' + opacity + ';border:' + border + ';z-index:' + zIdx + ';box-shadow:' + shadow + '" onclick="event.stopPropagation();go({page:\'detail\',detail:' + d.id + '})">' +
      '<div class="scatter-tooltip">' + esc(d.name) + '<br>' + d.rating.toFixed(1) + '\u2605 \u00B7 $' + d.rent + '/mo \u00B7 ' + d.wouldRent + '% would rent again</div>' +
    '</div>';
  }).join('');

  // Average crosshair lines (always shown, more prominent when a landlord is highlighted)
  var avgX = xPos(avgRent);
  var avgY = yPos(avgRating);
  var crosshairOpacity = hasHL ? '0.5' : '0.15';
  var avgMarker = '<div style="position:absolute;left:' + avgX + '%;top:' + padT + 'px;bottom:' + padB + 'px;border-left:1px dashed rgba(255,95,5,' + crosshairOpacity + ');z-index:1"></div>' +
    '<div style="position:absolute;top:' + avgY + 'px;left:' + padL + '%;right:' + padR + '%;border-top:1px dashed rgba(255,95,5,' + crosshairOpacity + ');z-index:1"></div>' +
    '<div style="position:absolute;left:' + avgX + '%;top:' + avgY + 'px;transform:translate(-50%,-50%);width:8px;height:8px;background:var(--orange);border-radius:0;z-index:1;opacity:' + (hasHL ? '0.7' : '0.3') + '"></div>' +
    (hasHL ? '<div style="position:absolute;left:' + (avgX+0.5) + '%;top:' + (avgY - 18) + 'px;font-size:9px;color:var(--orange);font-weight:600;white-space:nowrap;z-index:3">AVG</div>' : '');

  // Landlord checkbox list for multi-compare
  var sorted_data = data.slice().sort(function(a,b){return a.name.localeCompare(b.name);});
  var ddCheckboxes = sorted_data.map(function(d) {
    var checked = hlList.indexOf(d.id) !== -1;
    var color = d.rating >= 3.5 ? '#16A34A' : d.rating >= 2.5 ? '#EAB308' : '#DC2626';
    return '<label style="display:flex;align-items:center;gap:8px;padding:6px 10px;cursor:pointer;border-radius: 2px;transition:background 0.15s' + (checked ? ';background:rgba(255,95,5,0.08)' : '') + '" onmouseenter="this.style.background=\'rgba(255,95,5,0.05)\'" onmouseleave="this.style.background=\'' + (checked ? 'rgba(255,95,5,0.08)' : 'transparent') + '\'">' +
      '<input type="checkbox" ' + (checked ? 'checked' : '') + ' onchange="toggleScatterHL(' + d.id + ')" style="accent-color:var(--orange);width:16px;height:16px;cursor:pointer">' +
      '<span style="display:inline-block;width:10px;height:10px;border-radius:0;background:' + color + ';flex-shrink:0"></span>' +
      '<span style="font-size:13px;font-weight:500;color:var(--text)">' + esc(d.name) + '</span>' +
      '<span style="margin-left:auto;font-size:12px;color:var(--muted)">' + d.rating.toFixed(1) + '\u2605 $' + d.rent + '</span>' +
    '</label>';
  }).join('');

  // Y-axis grid lines at whole-number ratings within range
  var gridLines = '';
  for (var g = Math.ceil(minRating); g <= Math.floor(maxRating); g++) {
    var gy = yPos(g);
    gridLines += '<div style="position:absolute;left:' + padL + '%;right:' + padR + '%;top:' + gy + 'px;border-top:1px solid rgba(128,128,128,0.08)"></div>';
    if (!isMobile) {
      gridLines += '<div style="position:absolute;left:8px;top:' + (gy - 8) + 'px;font-size:11px;color:var(--muted);font-weight:600">' + g + '.0</div>';
    } else {
      gridLines += '<div style="position:absolute;left:0;top:' + (gy - 14) + 'px;font-size:9px;color:var(--muted);font-weight:600;background:var(--card-bg,#fff);padding:1px 3px;border-radius: 2px;z-index:3">' + g + '.0</div>';
    }
  }

  // X-axis rent labels — clean intervals, max ~5-6 labels to avoid cramming
  var rentRange = maxRent - minRent;
  var rentStep = isMobile
    ? (rentRange <= 400 ? 200 : rentRange <= 800 ? 400 : rentRange <= 1500 ? 500 : 750)
    : (rentRange <= 400 ? 100 : rentRange <= 800 ? 200 : rentRange <= 1500 ? 250 : 500);
  var rentLabels = '';
  var startR = Math.ceil(minRent / rentStep) * rentStep;
  for (var r = startR; r <= maxRent; r += rentStep) {
    var rx = xPos(r);
    rentLabels += '<div style="position:absolute;left:' + rx + '%;bottom:8px;transform:translateX(-50%);font-size:' + (isMobile ? '9px' : '11px') + ';color:var(--muted);font-weight:500">$' + r + '</div>';
    // Vertical tick
    gridLines += '<div style="position:absolute;left:' + rx + '%;top:' + padT + 'px;bottom:' + padB + 'px;border-left:1px solid rgba(128,128,128,0.06)"></div>';
  }

  // Axis lines
  var axes = '<div style="position:absolute;bottom:' + padB + 'px;left:' + padL + '%;right:' + padR + '%;height:1px;background:var(--border)"></div>' +
    '<div style="position:absolute;top:' + padT + 'px;bottom:' + padB + 'px;left:' + padL + '%;width:1px;background:var(--border)"></div>';

  return '<div class="scatter-wrap">' +
    '<div class="scatter-header">' +
      '<div class="scatter-title">Rent vs. Rating</div>' +
      '<div class="scatter-legend">' +
        '<div class="scatter-legend-item"><div class="scatter-legend-dot" style="background:#16A34A"></div>3.5+ stars</div>' +
        '<div class="scatter-legend-item"><div class="scatter-legend-dot" style="background:#EAB308"></div>2.5\u20133.4</div>' +
        '<div class="scatter-legend-item"><div class="scatter-legend-dot" style="background:#DC2626"></div>Below 2.5</div>' +
      '</div>' +
    '</div>' +
    '<div class="scatter-subtitle">Are you getting what you pay for? Dots in the <strong style="color:var(--good-text)">upper-left</strong> are great deals. Dots in the <strong style="color:var(--bad-text)">lower-right</strong> are overpriced. Bigger dots = more reviews.</div>' +
    '<div class="scatter-chart" style="height:' + chartH + 'px">' +
      gridLines +
      axes +
      avgMarker +
      dots +
      rentLabels +
    '</div>' +
    '<div class="scatter-axis-x">Avg Monthly Rent \u2192</div>' +
    '<div style="margin-top:16px">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">' +
        '<span style="font-size:13px;font-weight:600;color:var(--text)">Compare landlords</span>' +
        (hasHL ? '<span style="font-size:12px;color:var(--orange);cursor:pointer;font-weight:500" onclick="go({highlightLandlords:[]})">Clear all</span>' : '') +
      '</div>' +
      '<div style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius: 2px;padding:4px;background:var(--card-bg)">' +
        ddCheckboxes +
      '</div>' +
      (hasHL && hlList.length >= 2 ? '<div style="margin-top:12px;text-align:center"><button onclick="go({page:\'h2h\',h2hA:' + hlList[0] + ',h2hB:' + hlList[1] + '})" style="padding:10px 20px;background:var(--orange-btn);color:white;border:none;border-radius: 2px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">Open Head-to-Head \u2192</button></div>' : '') +
    '</div>' +
  '</div>';
}

function InsightsPage() {
  var chart = RentVsRatingChart();
  // Build additional stats
  var allStats = SEED_LANDLORDS.map(getLandlordStats).concat((userLandlords || []).map(function(ul) { return getLandlordStats({ id: ul.id, name: ul.name, props: 0, rating: 0, reviews: 0, wouldRent: 0, responseRate: "—", scores:{maintenance:0,communication:0,fairness:0,moveOut:0}, topTags:[], dist:[0,0,0,0,0] }); }));
  var withReviews = allStats.filter(function(l) { return l.reviews > 0; });
  var totalReviews = getReviewCount();
  var avgRating = withReviews.length ? (withReviews.reduce(function(s,l){ return s + l.rating; }, 0) / withReviews.length).toFixed(2) : '—';
