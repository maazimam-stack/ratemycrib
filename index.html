// "[Lease: Fall 2025 – Summer 2026] words" -> { lease: 'Fall 2025 – Summer 2026', body: 'words' } (one parser everywhere)
function splitLease(text) {
  const t = String(text || ''), m = t.match(/^\s*\[Lease:\s*([^\]]+)\]\s*/i);
  return m ? { lease: m[1].trim(), body: t.slice(m[0].length) } : { lease: '', body: t };
}
function heroReviewCardHTML(pick) {

function getHeroQuote() {
  const revs = allReviews().filter(r => r.text && r.text.length > 30 && r.text.length < 200 && r.rating >= 1);
  if (revs.length === 0) return '';
  // Shuffle reviews deterministically based on day seed, then rotate through them
  const daySeed = Math.floor(Date.now() / 86400000);
  const shuffled = revs.slice().sort((a,b) => {
    const ha = (a.id || a.text).toString().split('').reduce((s,c) => s + c.charCodeAt(0), daySeed);
    const hb = (b.id || b.text).toString().split('').reduce((s,c) => s + c.charCodeAt(0), daySeed);
    return ha - hb;
  });
  const pick = shuffled[0];
  return '<div class="hero-live">' +
    '<div class="hero-live-label"><span class="hero-live-dot"></span>Live from campus</div>' +
    '<div class="hero-review-card" id="hero-quote">' + heroReviewCardHTML(pick) + '</div>' +
  '</div>';
}
// Rotate hero review card every 6 seconds
var _heroQuoteIdx = 0;
setInterval(function() {
  var el = document.getElementById('hero-quote');
  if (!el) return;
  var revs = allReviews().filter(function(r){ return r.text && r.text.length > 30 && r.text.length < 200 && r.rating >= 1; });
  if (revs.length < 2) return;
  _heroQuoteIdx = (_heroQuoteIdx + 1) % revs.length;
  var pick = revs[_heroQuoteIdx];
  el.style.opacity = '0';
  setTimeout(function() {
    el.innerHTML = heroReviewCardHTML(pick);
    el.style.opacity = '1';
  }, 400);
}, 6000);

function ResultsList() {
  // Merge seed landlords with user-submitted landlords that have reviews

    const fake = { id: ul.id, name: ul.name, props: 0, rating: 0, reviews: 0, wouldRent: 0, responseRate: "—",
      scores:{maintenance:0,communication:0,fairness:0,moveOut:0}, topTags:["New Listing"], dist:[0,0,0,0,0] };
    return getLandlordStats(fake);
  }).filter(l => l.reviews > 0);
  let list = [...seedStats, ...userStats];
  if (S.filter === "top") list = list.filter(l => l.rating >= 3.5 && l.reviews >= MIN_LABEL_REVIEWS);
  else if (S.filter === "avoid") list = list.filter(l => l.rating > 0 && l.rating < 2.5 && l.reviews >= MIN_LABEL_REVIEWS);
  else if (S.filter === "responsive") list = list.filter(l => parseInt(l.responseRate) >= 60);

  // Neighborhood filter from Hoods page link
  if (S.hoodFilter) {
    list = list.filter(l => {
      const revs = getReviewsForLandlord(l);
      return revs.some(r => r.hoodName === S.hoodFilter);
    });
  }

  // Separate reviewed and unreviewed landlords
  const reviewed = list.filter(l => l.reviews > 0);
  const unreviewed = list.filter(l => l.reviews === 0);

  // Sort reviewed landlords by selected sort
  // Landlords with MIN_LABEL_REVIEWS+ reviews are ranked first; early reads (1-2 reviews) follow.
  // Within each group the order is weighted, so one glowing (or furious) review can't decide it.
  const rankTier = l => l.reviews >= MIN_LABEL_REVIEWS ? 0 : 1;
  if (S.sort === "rating") {
    const mean = siteMeanRating();
    reviewed.sort((a,b) => (rankTier(a) - rankTier(b)) || (weightedRating(b, mean) - weightedRating(a, mean)) || (b.reviews - a.reviews));
  }
  else if (S.sort === "reviews") reviewed.sort((a,b) => (b.reviews - a.reviews) || (b.rating - a.rating));
  else if (S.sort === "wouldRent") {
    const meanPct = siteWouldRentPct();
    reviewed.sort((a,b) => (rankTier(a) - rankTier(b)) || (weightedWouldRent(b, meanPct) - weightedWouldRent(a, meanPct)) || (b.reviews - a.reviews));

  // Unreviewed sorted alphabetically

        ${S.search ? '<button onclick="clearSearch()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;color:var(--muted);padding:4px 6px;line-height:1">&times;</button>' : ''}
      </div>
      <p class="home-street-link">Want to live near your classes? <a href="#streets">Browse reviews by street</a></p>
    </div>
    <div class="results-header">
      <div class="results-count" id="results-count">${S.hoodFilter ? '<span style="color:var(--orange);font-weight:700">' + esc(S.hoodFilter) + '</span> · ' : ''}${reviewed.length} landlord${reviewed.length!==1?'s':''} with reviews${S.hoodFilter ? ' <span style="color:var(--muted);font-size:12px;cursor:pointer;margin-left:6px" onclick="go({hoodFilter:null})">(clear filter)</span>' : ''}</div>
      <select class="sort-select" aria-label="Sort landlords" title="Ratings are weighted by number of reviews — see How Scores Work" onchange="go({sort:this.value})">
        <option value="rating" ${S.sort==='rating'?'selected':''}>Highest Rated</option>
        <option value="reviews" ${S.sort==='reviews'?'selected':''}>Most Reviews</option>
        <option value="wouldRent" ${S.sort==='wouldRent'?'selected':''}>Would Rent Again %</option>

    ${showUnreviewed ? `
      <div style="margin-top:32px;padding-top:24px;border-top:1px solid var(--border)">
        <h3 style="font-size:14px;font-weight:600;color:var(--muted);margin-bottom:16px;text-transform:uppercase;letter-spacing:0.5px">Not yet reviewed</h3>
        ${unreviewed.map(ResultCard).join("")}

    </div>` : ''}

  </div>`;

// "Did you get your security deposit back?" across reviews whose lease is over. Shown from 3 answers, like ratings.
function depositStats(revs) {
  const a = revs.filter(r => r.depositBack === 'full' || r.depositBack === 'partial' || r.depositBack === 'none');

  const pct = v => Math.round(a.filter(r => r.depositBack === v).length / a.length * 100);
  return { n: a.length, full: pct('full'), partial: pct('partial'), none: pct('none') };
}

// ===== BROWSE BY STREET =====
// Reviewers type addresses freely: "309 e green", "711 S 4th St (The VUE)", "604 W Stoughton st, 18".
// parseStreetAddress() turns that into a building (house number + direction + street), drops any
// unit number, and keeps a building name given in parentheses. buildStreetIndex() groups every
// review by street and building, in order along the street, for the Streets page.
const STREET_SUFFIXES = { st:'St', street:'St', ave:'Ave', av:'Ave', avenue:'Ave', dr:'Dr', drive:'Dr', blvd:'Blvd', boulevard:'Blvd', ct:'Ct', court:'Ct', pl:'Pl', place:'Pl', rd:'Rd', road:'Rd', ln:'Ln', lane:'Ln', way:'Way', cir:'Cir', circle:'Cir', ter:'Ter', terrace:'Ter', pkwy:'Pkwy', parkway:'Pkwy', sq:'Sq', square:'Sq' };
const STREET_DIRS = { n:'N', north:'N', s:'S', south:'S', e:'E', east:'E', w:'W', west:'W' };
const ORDINAL_STREETS = { '1st':'First', first:'First', '2nd':'Second', second:'Second', '3rd':'Third', third:'Third', '4th':'Fourth', fourth:'Fourth', '5th':'Fifth', fifth:'Fifth', '6th':'Sixth', sixth:'Sixth', '7th':'Seventh', seventh:'Seventh', '8th':'Eighth', eighth:'Eighth', '9th':'Ninth', ninth:'Ninth', '10th':'Tenth', tenth:'Tenth' };
const ORDINAL_NUMBERS = { First:'1st', Second:'2nd', Third:'3rd', Fourth:'4th', Fifth:'5th', Sixth:'6th', Seventh:'7th', Eighth:'8th', Ninth:'9th', Tenth:'10th' };
// Streets around campus: usual suffix (for "212 Chalmers") and whether they run east-west or north-south
// (so "711 E 4th St" is read as 711 4th St, since a north-south street has no East side).
const CU_STREETS = {
  green:['St','ew'], john:['St','ew'], daniel:['St','ew'], chalmers:['St','ew'], armory:['Ave','ew'], healey:['St','ew'],
  stoughton:['St','ew'], clark:['St','ew'], white:['St','ew'], springfield:['Ave','ew'], university:['Ave','ew'],
  main:['St','ew'], illinois:['St','ew'], nevada:['St','ew'], oregon:['St','ew'], iowa:['St','ew'], ohio:['St','ew'],
  pennsylvania:['Ave','ew'], california:['Ave','ew'], peabody:['Dr','ew'], gregory:['Dr','ew'], kirby:['Ave','ew'],
  church:['St','ew'], hill:['St','ew'], park:['St','ew'], elm:['St','ew'],
  wright:['St','ns'], first:['St','ns'], second:['St','ns'], third:['St','ns'], fourth:['St','ns'], fifth:['St','ns'],
  sixth:['St','ns'], locust:['St','ns'], lincoln:['Ave','ns'], goodwin:['Ave','ns'], mathews:['Ave','ns'],
  busey:['Ave','ns'], neil:['St','ns'], state:['St','ns'], randolph:['St','ns'], race:['St','ns']
};
const ADDRESS_STOP_WORDS = { apt:1, apartment:1, unit:1, ste:1, suite:1, rm:1, room:1, bldg:1, building:1, fl:1, floor:1, no:1, champaign:1, urbana:1, savoy:1, il:1 };

function parseStreetAddress(raw) {
  if (!raw) return null;
  const text = String(raw);
  const named = text.match(/\(([^)]{2,40})\)/);
  const buildingName = named ? named[1].trim() : '';
  // The comma-separated piece that starts with a house number, without the parenthesized name
  const seg = text.replace(/\([^)]*\)/g, ' ').split(/[,;\n]/).map(p => p.trim()).find(p => /^\d/.test(p));
  if (!seg) return null;
  const toks = seg.toLowerCase().replace(/[.#]/g, ' ').replace(/[^a-z0-9\s-]/g, ' ').split(/\s+/).filter(t => /[a-z0-9]/.test(t));
  const num = toks[0] && toks[0].match(/^(\d{1,5})/);
  if (!num) return null;
  const number = parseInt(num[1], 10);
  if (!number) return null;
  let i = 1, dir = '';
  if (toks[i] && STREET_DIRS[toks[i]] && toks[i + 1]) { dir = STREET_DIRS[toks[i]]; i++; }
  const name = [];
  let suffix = '';
  for (; i < toks.length; i++) {
    const t = toks[i];
    if (STREET_SUFFIXES[t] && name.length) { suffix = STREET_SUFFIXES[t]; break; }
    if (ADDRESS_STOP_WORDS[t] || (/\d/.test(t) && !ORDINAL_STREETS[t]) || t === '-') break;
    if (name.length === 3) break;
    name.push(ORDINAL_STREETS[t] || (t.charAt(0).toUpperCase() + t.slice(1)));
  }
  if (!name.length) return null;
  const nameKey = name.join(' ').toLowerCase();
  const known = CU_STREETS[nameKey];
  if (!suffix && known) suffix = known[0];
  if (known && dir && (known[1] === 'ew') !== (dir === 'E' || dir === 'W')) dir = '';
  return { number, dir, name: name.join(' '), nameKey, suffix, buildingName };
}

const streetLabelOf = a => a.name + (a.suffix ? ' ' + a.suffix : '');
const buildingLabelOf = (number, dir, street) => number + ' ' + (dir ? dir + ' ' : '') + street;

// The address to show for a review: the building, never the unit ("608 E University Ave, Apt 1616" -> "608 E University Ave")
function displayAddress(raw) {
  if (!raw || raw === 'Not specified') return raw || '';
  const a = parseStreetAddress(raw);
  if (a) return buildingLabelOf(a.number, a.dir, streetLabelOf(a)) + (a.buildingName ? ' (' + a.buildingName + ')' : '');
  return stripUnit(raw);
}
function stripUnit(raw) {
  return String(raw || '').replace(/\s*,?\s*(?:#|\b(?:apt|apartment|unit|ste|suite|rm|room)\b\.?)\s*[\w-]+/gi, '').replace(/,\s*(?=[\w-]{1,5}\s*$)(?=[^,]*\d)[\w-]{1,5}\s*$/, '').replace(/\s+,/g, ',').trim();
}

function withinOneEdit(a, b) {
  if (a === b) return true;
  if (Math.abs(a.length - b.length) > 1) return false;
  let i = 0, j = 0, edits = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++edits > 1) return false;
    if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; }
  }
  return edits + (a.length - i) + (b.length - j) <= 1;
}

let _streetIndexCache = { src: null, n: -1, idx: null };
function buildStreetIndex() {
  const revs = allReviews();
  const ul = (typeof userLandlords !== 'undefined' && userLandlords) ? userLandlords.length : 0;
  if (_streetIndexCache.src === dbReviews && _streetIndexCache.n === revs.length && _streetIndexCache.ul === ul) return _streetIndexCache.idx;
  const parsed = [];
  let unplaced = 0;
  revs.forEach(r => {
    const a = parseStreetAddress(r.property);
    if (a) parsed.push({ r, a }); else unplaced++;
  });
  // "212 Chalmers" -> Chalmers St when every other review of that street name agrees on the suffix
  const suffixes = Object.create(null); // these street maps are keyed by typed addresses: no inherited keys
  parsed.forEach(({ a }) => { if (a.suffix) (suffixes[a.nameKey] = suffixes[a.nameKey] || Object.create(null))[a.suffix] = 1; });
  parsed.forEach(({ a }) => {
    const s = suffixes[a.nameKey] ? Object.keys(suffixes[a.nameKey]) : [];
    if (!a.suffix && s.length === 1) a.suffix = s[0];
    a.street = streetLabelOf(a);
    a.key = slugify(a.street);
  });
  // Typos: "905 welsh dr" and "905 Welch Dr" are one street when the names differ by one letter, share a
  // suffix and share a house number. The less-used spelling is folded into the more-used one.
  const byKey = Object.create(null);
  parsed.forEach(({ a }) => {
    const k = byKey[a.key] = byKey[a.key] || { nameKey: a.nameKey, name: a.name, suffix: a.suffix, street: a.street, count: 0, numbers: Object.create(null) };
    k.count++; k.numbers[a.number] = 1;
  });
  const keys = Object.keys(byKey).sort((x, y) => byKey[y].count - byKey[x].count);
  const renamed = Object.create(null);
  keys.forEach((k, i) => {
    if (renamed[k]) return;
    for (let j = i + 1; j < keys.length; j++) {
      const a = byKey[k], b = byKey[keys[j]];
      if (renamed[keys[j]] || a.suffix !== b.suffix || a.nameKey.length < 4 || b.nameKey.length < 4 || !withinOneEdit(a.nameKey, b.nameKey)) continue;
      if (Object.keys(b.numbers).some(n => a.numbers[n])) renamed[keys[j]] = k;
    }
  });
  parsed.forEach(({ a }) => {
    const to = renamed[a.key] && byKey[renamed[a.key]];
    if (to) { a.name = to.name; a.nameKey = to.nameKey; a.street = to.street; a.key = renamed[a.key]; }
  });
  // "212 Green St" -> 212 E Green St when every other review of that building agrees on the direction
  const dirs = Object.create(null);
  parsed.forEach(({ a }) => { if (a.dir) (dirs[a.key + '|' + a.number] = dirs[a.key + '|' + a.number] || Object.create(null))[a.dir] = 1; });
  parsed.forEach(({ a }) => {
    const d = dirs[a.key + '|' + a.number] ? Object.keys(dirs[a.key + '|' + a.number]) : [];
    if (!a.dir && d.length === 1) a.dir = d[0];
  });

  const streets = Object.create(null);
  parsed.forEach(({ r, a }) => {
    const st = streets[a.key] = streets[a.key] || { key: a.key, label: a.street, nameKey: a.nameKey, buildings: Object.create(null), reviewCount: 0 };
    st.reviewCount++;
    const bk = a.number + '|' + a.dir;
    const b = st.buildings[bk] = st.buildings[bk] || { number: a.number, dir: a.dir, reviews: [], names: Object.create(null) };
    b.reviews.push(r);
    if (a.buildingName) b.names[a.buildingName] = (b.names[a.buildingName] || 0) + 1;
  });

  Object.values(streets).forEach(st => {
    const blds = Object.values(st.buildings);
    const known = CU_STREETS[st.nameKey];
    st.orient = known ? known[1]
      : blds.some(b => b.dir === 'E' || b.dir === 'W') ? 'ew'
      : blds.some(b => b.dir === 'N' || b.dir === 'S') ? 'ns' : '';
    // Position along the street: west to east (Champaign's E numbers rise toward Wright St, Urbana's W numbers fall
    // past it), or north to south (N numbers fall toward the center, S numbers rise away from it).
    const pos = b => st.orient === 'ns' ? (b.dir === 'N' ? -b.number : b.number) : (b.dir === 'W' ? 100000 - b.number : b.number);
    st.list = blds.map(b => {
      const n = b.reviews.length;
      const rents = b.reviews.map(r => r.monthlyRent).filter(isValidRent);
      const landlords = Object.create(null);
      b.reviews.forEach(r => {
        const id = LANDLORD_ALIASES[r.landlordId] || r.landlordId;
        const l = findLandlord(id);
        const lname = l ? l.name : (r.landlordName && r.landlordName !== 'Unmatched' ? r.landlordName : '');
        if (lname) landlords[lname] = (landlords[lname] || 0) + 1;
      });
      const topName = Object.entries(b.names).sort((x, y) => y[1] - x[1])[0];
      return {
        number: b.number, dir: b.dir, position: pos(b),
        label: buildingLabelOf(b.number, b.dir, st.label),
        buildingName: topName ? topName[0] : '',
        reviews: b.reviews.slice().sort((x, y) => (y.createdAt || 0) - (x.createdAt || 0)),
        count: n,
        rating: b.reviews.reduce((s, r) => s + r.rating, 0) / n,
        wouldRent: Math.round(b.reviews.filter(r => r.wouldRent).length / n * 100),
        avgRent: rents.length ? Math.round(rents.reduce((s, v) => s + v, 0) / rents.length) : 0,
        rentCount: rents.length,
        landlords: Object.entries(landlords).sort((x, y) => y[1] - x[1]).map(x => x[0])
      };
    }).sort((x, y) => (x.position - y.position) || (x.number - y.number));
    st.buildingCount = st.list.length;
  });
  const placeOf = new Map();
  Object.values(streets).forEach(st => st.list.forEach(b => b.reviews.forEach(r => placeOf.set(r, { streetKey: st.key, streetLabel: st.label, label: b.label, buildingName: b.buildingName }))));
  const idx = {
    streets,
    unplaced,
    placeOf,
    list: Object.values(streets).sort((a, b) => (b.reviewCount - a.reviewCount) || a.label.localeCompare(b.label))
  };
  _streetIndexCache = { src: dbReviews, n: revs.length, ul, idx };
  return idx;
}

function toggleStreet(key) {
  const cur = (S.streets || []).slice();
  const i = cur.indexOf(key);
  if (i === -1) cur.push(key); else cur.splice(i, 1);
  trackEvent('street_toggle', { street: key, selected: i === -1, count: cur.length });
  go({ page: 'streets', streets: cur });
}

// Filters the street buttons in place, so typing never loses focus to a re-render
function filterStreetChips(value) {
  S.streetSearch = value;
  const q = (value || '').trim().toLowerCase();
  const qq = ORDINAL_STREETS[q] ? ORDINAL_STREETS[q].toLowerCase() : q;
  let matches = 0;
  document.querySelectorAll('.street-chip').forEach(el => {
    const match = !qq || el.getAttribute('data-search').indexOf(qq) !== -1;
    el.hidden = !match && !el.classList.contains('on'); // picked streets stay visible

  });

// ===== NEAR YOUR CLASSES (major + class standing) =====
// data/majors.json: where each major's classes meet, by year: the Academic Catalog's sample plan for the
//   major, joined with the buildings those courses meet in (Course Explorer, Fall 2026 and Spring 2026).
// data/places.json: map positions for campus buildings (OpenStreetMap) and reviewed addresses (US Census geocoder).
// Both are static files built by tools/campus-data/; the major you pick stays in this browser.
let campusData = null;
let campusDataState = 'idle'; // idle | loading | ready | failed
function loadCampusData() {
  if (campusDataState !== 'idle') return;
  campusDataState = 'loading';
  Promise.all([fetch('/data/majors.json').then(r => r.json()), fetch('/data/places.json').then(r => r.json())])
    .then(([majors, places]) => { campusData = { majors, places, bySlug: Object.fromEntries(majors.map(m => [m.slug, m])) }; campusDataState = 'ready'; })
    .catch(() => { campusDataState = 'failed'; })
    .finally(() => { if (S.page === 'streets' && !S.modal) render(); });
}
const YEAR_LABELS = ['', 'Freshman', 'Sophomore', 'Junior', 'Senior'];
// Years a program has data for, and how to name them: undergrad (Freshman…), professional (1L…, 1st year…),
// or one set of classes for every year (graduate programs).
function majorYears(m) {
  const keys = m ? Object.keys(m.years).map(Number).filter(Boolean).sort((a, b) => a - b) : [1, 2, 3, 4];
  return keys.map(y => ({ y, label: (m && m.labels && m.labels[y]) || YEAR_LABELS[y] || 'Year ' + y }));
}
function majorYearFor(m) {
  const ys = majorYears(m).map(x => x.y), want = S.majorYear || 2;
  return ys.indexOf(want) !== -1 ? want : ys.indexOf(2) !== -1 ? 2 : ys[0];
}
function loadMajorChoice() {
  try { const v = JSON.parse(localStorage.getItem('rmc-major') || 'null'); if (v && v.slug) { S.major = v.slug; S.majorYear = v.year || 2; } } catch (e) {}
}
function setMajorChoice(slug, year) {
  try { localStorage.setItem('rmc-major', JSON.stringify({ slug, year })); } catch (e) {}
  trackEvent('major_pick', { major: slug, year });
  go({ major: slug, majorYear: year });
}
// While typing, only a full name that isn't the start of another one ("Chemistry, BS" waits: "Chemistry, BSLAS"
// exists). On Enter or leaving the box, a common name ("medicine", "law school") or "computer sci" is enough.
function findMajor(value, loose) {
  const v = (value || '').trim().toLowerCase();
  if (!campusData || v.length < 2) return null;
  const all = campusData.majors;
  const exactName = all.find(x => x.name.toLowerCase() === v);
  if (!loose) return exactName && !all.some(x => x !== exactName && x.name.toLowerCase().startsWith(v)) ? exactName : null;
  const exact = exactName || all.find(x => (x.aka || []).indexOf(v) !== -1);
  if (exact) return exact;
  const base = x => x.name.split(',')[0].toLowerCase(); // "Finance, BS" -> "finance"
  return all.find(x => base(x) === v) || all.find(x => x.name.toLowerCase().startsWith(v)) ||
    all.find(x => (x.aka || []).some(a => a.startsWith(v))) || all.find(x => x.name.toLowerCase().indexOf(v) !== -1) || null;
}
function onMajorInput(el, loose) {
  const m = findMajor(el.value, loose);
  const none = document.getElementById('nc-nomatch');
  if (none) none.hidden = !(loose && !m && el.value.trim());
  if (m && m.slug !== S.major) setMajorChoice(m.slug, majorYearFor(m));
  else if (m && loose && el.value !== m.name) el.value = m.name; // already picked: show its full name
}
function clearMajorChoice() {
  try { localStorage.removeItem('rmc-major'); } catch (e) {}
  go({ major: null });
}

// Walking time: straight-line distance stretched for the street grid, at about 3 mph
function walkMinutes(a, b) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (b[0] - a[0]) * rad, dLng = (b[1] - a[1]) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h)) * 1.3 / 80;
}

// Where the chosen major's classes are that year. Shares for walk times use only buildings we can place.
function classSpots() {
  if (!campusData || !S.major) return null;
  const m = campusData.bySlug[S.major];
  const y = m && m.years[majorYearFor(m)];
  if (!y) return null;
  const spots = y.buildings.map(([name, share]) => ({ name, share, pos: campusData.places.b[name] || null }));
  const placed = spots.filter(s => s.pos);
  const total = placed.reduce((t, s) => t + s.share, 0);
  return { major: m, year: y, spots, placed: total ? placed.map(s => ({ ...s, w: s.share / total })) : [] };
}
function minutesToClasses(pos, cs) {
  if (!pos || !cs || !cs.placed.length) return null;
  return cs.placed.reduce((t, s) => t + s.w * walkMinutes(pos, s.pos), 0);
}

// Map position for each reviewed building: its geocoded address, else estimated from geocoded neighbours on the same street
let _bldgPosCache = { idx: null, data: null, map: null };
function buildingPositions(idx) {
  if (!campusData) return null;
  if (_bldgPosCache.idx === idx && _bldgPosCache.data === campusData) return _bldgPosCache.map;
  const map = new Map(), A = campusData.places.a || {};
  Object.values(idx.streets).forEach(st => {
    const known = [];
    st.list.forEach(b => {
      const hit = b.reviews.map(r => A[(r.property || '').trim()]).find(Boolean);
      if (hit) { map.set(b, hit); known.push({ p: b.position, pos: hit }); }
    });
    if (!known.length) return;
    known.sort((x, y) => x.p - y.p);
    st.list.forEach(b => {
      if (map.has(b)) return;
      let lo = null, hi = null;
      known.forEach(k => { if (k.p <= b.position) lo = k; if (k.p >= b.position && !hi) hi = k; });
      // Only between neighbours a few blocks apart: Champaign's E and Urbana's W numbers share street names
      if (lo && hi && hi.p !== lo.p && hi.p - lo.p <= 800) {
        const t = (b.position - lo.p) / (hi.p - lo.p);
        map.set(b, [lo.pos[0] + t * (hi.pos[0] - lo.pos[0]), lo.pos[1] + t * (hi.pos[1] - lo.pos[1])]);
      } else {
        const near = [lo, hi].filter(Boolean).sort((x, y) => Math.abs(x.p - b.position) - Math.abs(y.p - b.position))[0];
        if (near && Math.abs(near.p - b.position) <= 300) map.set(b, near.pos); // within ~3 blocks
      }
    });
  });
  _bldgPosCache = { idx, data: campusData, map };
  return map;
}

// Streets ranked by the walk from their closest reviewed building to the chosen major's classes
function closestStreets(idx, cs, limit) {
  const pos = buildingPositions(idx);
  if (!pos) return [];
  return idx.list.map(st => {
    const times = st.list.map(b => minutesToClasses(pos.get(b), cs)).filter(t => t != null);
    return times.length ? { st, best: Math.min(...times) } : null;
  }).filter(Boolean).sort((a, b) => a.best - b.best).slice(0, limit);
}
function showNearStreets() {
  const cs = classSpots();
  if (!cs) return;
  const keys = closestStreets(buildStreetIndex(), cs, 3).map(x => x.st.key);
  trackEvent('near_classes_show', { major: S.major, year: S.majorYear || 2 });
  go({ page: 'streets', streets: keys });
  setTimeout(() => { const el = document.querySelector('.street-section'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50);
}
function walkLabel(b) {
  if (!_ncSpots) return '';
  const pos = buildingPositions(buildStreetIndex());
  const t = pos && minutesToClasses(pos.get(b), _ncSpots);
  return t == null ? '' : '≈ ' + Math.max(1, Math.round(t)) + ' min walk to your classes';
}

// The address shown on a review card: the building as grouped on the Streets page, never the unit
function reviewAddressLabel(r) {
  const p = buildStreetIndex().placeOf.get(r);
  if (p) return p.label + (p.buildingName ? ' (' + p.buildingName + ')' : '');
  return displayAddress(r.property);
}

function Compare() {
  // Build comparison from actual review data — no hardcoded properties
  const revs = allReviews();
  // Group reviews by address, computing avg rent and linking to landlord
  const addrMap = Object.create(null); // keyed by typed addresses: no inherited keys
  revs.forEach(r => {
    if (!r.property || r.property === 'Not specified') return;
    const place = reviewAddressLabel(r);
    if (!addrMap[place]) addrMap[place] = { name: place, landlordId: r.landlordId, landlordName: r.landlordName || '', hood: r.hoodName || '', reviews: [], rents: [] };
    addrMap[place].reviews.push(r);
    if (isValidRent(r.monthlyRent)) addrMap[place].rents.push(r.monthlyRent);
  });
  let filtered = Object.values(addrMap).map(a => ({
    ...a,
    reviewPrice: a.rents.length ? Math.round(a.rents.reduce((s,v)=>s+v,0)/a.rents.length) : 0,
    reviewCount: a.reviews.length
  }));

  // Apply filters
  if (S.cmpHood && S.cmpHood !== 'all') {
    filtered = filtered.filter(p => p.hood === S.cmpHood);
  }
  if (S.cmpMaxRent && S.cmpMaxRent > 0) {
    filtered = filtered.filter(p => p.reviewPrice > 0 && p.reviewPrice <= S.cmpMaxRent);
  }

  // Sort: price data first, then alphabetical
  const sorted = filtered.sort((a,b) => {
    if (a.reviewPrice && b.reviewPrice) return a.reviewPrice - b.reviewPrice;
    if (a.reviewPrice) return -1;
    if (b.reviewPrice) return 1;
    return a.name.localeCompare(b.name);
  });
  const allHoods = [...new Set(revs.map(r => r.hoodName).filter(Boolean))];

  const hasData = sorted.length > 0;

  return `<div style="background:var(--brand-navy);padding:48px 24px 40px;text-align:center;position:relative;overflow:hidden">
    <h2 style="font-size:32px;font-weight:900;color:white;letter-spacing:-1px;margin-bottom:8px;position:relative">Compare Prices</h2>
    <p style="color:rgba(255,255,255,0.5);font-size:15px;position:relative">Real rent data from student reviews. All prices are per person/month.</p>
  </div>
  <div class="container" style="padding-top:32px">
    ${hasData ? `
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;align-items:center;background:var(--light);padding:16px 20px;border-radius: 2px;border:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:6px">
        <label for="cmp-hood" style="font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px">Area</label>
        <select id="cmp-hood" style="padding:8px 12px;border:1px solid var(--border);border-radius: 2px;font-size:13px;font-family:inherit;background:var(--card-bg);color:var(--text)" onchange="go({cmpHood:this.value})">
          <option value="all">All</option>
          ${allHoods.map(h => `<option value="${esc(h)}" ${S.cmpHood===h?'selected':''}>${esc(h)}</option>`).join('')}
        </select>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <label for="cmp-max-rent" style="font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px">Max Rent</label>
        <select id="cmp-max-rent" style="padding:8px 12px;border:1px solid var(--border);border-radius: 2px;font-size:13px;font-family:inherit;background:var(--card-bg);color:var(--text)" onchange="go({cmpMaxRent:parseInt(this.value)||0})">
          <option value="0">No limit</option>
          <option value="600" ${S.cmpMaxRent===600?'selected':''}>Under $600</option>
          <option value="800" ${S.cmpMaxRent===800?'selected':''}>Under $800</option>
          <option value="1000" ${S.cmpMaxRent===1000?'selected':''}>Under $1,000</option>
          <option value="1200" ${S.cmpMaxRent===1200?'selected':''}>Under $1,200</option>
        </select>
      </div>
    </div>
    <div style="overflow-x:auto">
      <table class="compare-tbl">
        <thead><tr><th>Address</th><th>Landlord</th><th>Neighborhood</th><th>Price/mo</th><th>Rating</th><th>Value*</th></tr></thead>
        <tbody>
          ${sorted.map(p => {
            const l = findLandlord(p.landlordId);
            const lStats = l ? getLandlordStats(l) : null;
            const rating = lStats && lStats.reviews > 0 ? lStats.rating : 0;
            const val = (rating > 0 && p.reviewPrice > 0) ? (rating/p.reviewPrice*1000).toFixed(1) : '—';
            return `<tr style="cursor:pointer" onclick="go({page:'detail',detail:${p.landlordId}})">
              <td><strong>${esc(p.name)}</strong></td>
              <td>${l?esc(l.name):esc(p.landlordName)}</td>

              <td>${p.reviewPrice ? `<strong>$${p.reviewPrice}</strong><div style="font-size:10px;color:var(--muted)">from ${p.reviewCount} review${p.reviewCount!==1?'s':''}</div>` : '<span style="color:#9CA3AF">—</span>'}</td>
              <td style="color:${rating > 0 ? scoreColor(rating) : 'var(--muted)'};font-weight:${rating > 0 ? '600' : '400'}">${rating > 0 ? rating.toFixed(1) : '—'}</td>
              <td style="color:var(--muted)">${val}</td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>
    <p style="font-size:12px;color:var(--muted);margin-top:8px">*Value = Rating per $1,000/mo. Higher is better. Prices are averages from student reviews (per person/month).</p>
    ` : `
    <div style="text-align:center;padding:48px 24px">
      <div style="font-size:20px;margin-bottom:12px;color:rgba(255,255,255,0.3);font-weight:700">—</div>

// ===== LEASE SCANNER =====
const LEASE_FLAGS = [
  // HIGH SEVERITY — likely unenforceable or illegal under Illinois law
  {
    id: 'nonrefundable-deposit',
    patterns: [/non[\s-]?refundable\s+(security\s+)?deposit/i, /deposit.*(?:will\s+not|shall\s+not|cannot|won'?t)\s+be\s+returned/i],
    severity: 'high',
    title: 'Potentially Non-Refundable Security Deposit',
    explain: 'Illinois law requires landlords to return security deposits (minus documented deductions for actual damages) within 30 days for properties with 5+ units, or 45 days for smaller properties. A clause making a deposit entirely non-refundable may conflict with this requirement.',
    statute: '765 ILCS 710 — Security Deposit Return Act'
  },
  {
    id: 'waive-rights',
    patterns: [/waive.*(?:right|rights|remedies)/i, /tenant\s+(?:hereby\s+)?waives/i, /waiver\s+of\s+(?:tenant|all|any)\s+rights/i],
    severity: 'high',
    title: 'Waiver of Tenant Rights',
    explain: 'Under Illinois law, lease provisions that attempt to waive tenants\u2019 rights under the Security Deposit Return Act or local housing codes are generally void and unenforceable. You cannot be required to waive your statutory protections.',
    statute: '765 ILCS 710/6 — Provisions waiving tenant rights are void'
  },
  {
    id: 'no-repairs',
    patterns: [/tenant\s+(?:is\s+)?responsible\s+for\s+all\s+(?:repairs|maintenance)/i, /landlord.*(?:not|no)\s+(?:responsible|liable|obligat).*(?:repair|maintain|habitab)/i, /as[\s-]?is\s+condition/i, /accept.*premises.*(?:as[\s-]?is|current\s+condition)/i],
    severity: 'high',
    title: 'Potential Habitability Waiver',
    explain: 'Illinois landlords have an implied warranty of habitability — they must maintain the property in a livable condition regardless of what the lease says. Clauses that try to shift all repair responsibility to tenants or disclaim habitability obligations may be unenforceable.',
    statute: 'Jack Spring, Inc. v. Little (1972) — Implied Warranty of Habitability'
  },
  {
    id: 'lockout',
    patterns: [/lock[\s-]?out/i, /change.*locks.*(?:without|if|upon|for)/i, /deny\s+(?:access|entry).*(?:late|unpaid|overdue)/i, /remove\s+tenant.*property.*(?:unpaid|nonpayment)/i],
    severity: 'high',
    title: 'Potential Self-Help Eviction / Lockout',
    explain: 'Illinois law prohibits landlords from locking out tenants or removing their belongings without a court order, even if rent is unpaid. Only a court-ordered eviction process is legal. Clauses permitting lockouts are unenforceable.',
    statute: '735 ILCS 5/9-101 et seq. — Forcible Entry and Detainer Act'
  },
  {
    id: 'liability-waiver',
    patterns: [/tenant.*(?:waives?|releases?|holds?\s+harmless).*(?:landlord|owner|management).*(?:injury|damage|loss|negligence)/i, /(?:landlord|owner|management).*not\s+(?:liable|responsible).*(?:injury|personal|damage|theft|loss)/i],
    severity: 'high',
    title: 'Broad Liability Waiver',
    explain: 'Clauses that attempt to completely waive a landlord\u2019s liability for their own negligence (e.g., injuries caused by failure to maintain the property) may be unenforceable under Illinois law. Landlords generally cannot disclaim liability for negligence.',
    statute: 'Illinois common law — Public policy against negligence waivers in residential leases'
  },
  // MEDIUM SEVERITY — worth reviewing, potentially problematic
  {
    id: 'late-fee-excessive',
    patterns: [/late\s+fee.*\$\s*(?:[1-9]\d{2,}|[5-9]\d)/i, /(?:\$\s*(?:[1-9]\d{2,}|[5-9]\d)).*late\s+(?:fee|charge|penalty)/i, /late\s+(?:fee|charge|penalty).*(?:per\s+day|daily|compounding|10%|15%|20%)/i],
    severity: 'medium',
    title: 'Potentially Excessive Late Fee',
    explain: 'While Illinois doesn\u2019t set a specific dollar cap on late fees, Champaign city code and courts generally require that late fees be "reasonable" and proportional to actual damages from late payment. Fees that exceed 5% of monthly rent or include daily compounding penalties may be challenged as excessive.',
    statute: 'Champaign Municipal Code Ch. 12.5 — Landlord-Tenant Relationships'
  },
  {
    id: 'entry-no-notice',
    patterns: [/(?:landlord|owner|management|agent).*(?:may|shall|can|right\s+to)\s+enter.*(?:at\s+any\s+time|without\s+(?:notice|consent|permission))/i, /entry\s+without\s+(?:prior\s+)?notice/i, /unrestricted\s+(?:access|entry)/i],
    severity: 'medium',

function scanLease(text) {
  const results = [];
  const lowerText = text.toLowerCase();

  LEASE_FLAGS.forEach(flag => {
    for (const pattern of flag.patterns) {
      const match = text.match(pattern);
      if (match) {
        // Extract surrounding context (up to 100 chars each side)
        const idx = match.index;
        const start = Math.max(0, idx - 80);
        const end = Math.min(text.length, idx + match[0].length + 80);
        let snippet = text.slice(start, end).trim();
        if (start > 0) snippet = '...' + snippet;
        if (end < text.length) snippet = snippet + '...';

        results.push({
          ...flag,
          matchedText: snippet,
          matchedTerm: match[0]
        });
        break; // Only flag once per rule
      }
    }
  });

  return results;
}

async function trackScannerEvent(eventType, metadata = {}) {
  trackEvent('scanner_' + eventType, metadata);
}

const PRIVATE_EVENTS = ['review_submitted', 'verify_code_sent', 'verify_success', 'verify_failed'];
async function trackEvent(eventType, metadata = {}) {
  if (eventType === 'review_modal_open') window._lastModalOpenAt = Date.now();
  try {
    // Review and verification events carry no visitor/visit ID, no screen size and only the hour, so they
    // can't be joined to the rest of a visit or matched to a review by its exact time.
    const quiet = PRIVATE_EVENTS.indexOf(eventType) !== -1;
    const meta = Object.assign({}, metadata, { _src: ANALYTICS.src });
    if (!quiet) { meta._s = ANALYTICS.sid; if (ANALYTICS.vid) meta._v = ANALYTICS.vid; }
    const when = new Date(); if (quiet) when.setMinutes(0, 0, 0);
    let refOrigin = null;
    try { refOrigin = eventType === 'session_start' && document.referrer ? new URL(document.referrer).origin : null; } catch (e) {}
    await db.from('site_events').insert({
      event_type: eventType,
      metadata: meta,
      page: S.page || 'home',
      created_at: when.toISOString(),
      user_agent: deviceClass(), // "mobile" / "tablet" / "desktop" only
      referrer: refOrigin,       // e.g. https://www.reddit.com (never the full address)
      screen: quiet ? null : window.innerWidth + 'x' + window.innerHeight
    });
  } catch(e) {
    // Silent fail — analytics should never block UX
    console.log('Analytics event:', eventType, metadata);
  }
}

// ===== PDF TEXT EXTRACTION =====
// The PDF reader (~320 KB) is only needed by the lease scanner, so it loads the first time the scanner opens
// instead of on every visit. Same file, same origin; the lease itself is still read only in the browser.
var _pdfjsLoading = null;
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (_pdfjsLoading) return _pdfjsLoading;
  _pdfjsLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = '/vendor/pdf-3.11.174.min.js';
    s.onload = () => {
      if (!window.pdfjsLib) { _pdfjsLoading = null; reject(new Error('PDF reader missing')); return; }
      pdfjsLib.GlobalWorkerOptions.workerSrc = '/vendor/pdf.worker-3.11.174.min.js';
      resolve(window.pdfjsLib);
    };
    s.onerror = () => { _pdfjsLoading = null; s.remove(); reject(new Error('PDF reader failed to load')); };
    document.head.appendChild(s);
  });
  return _pdfjsLoading;
}
async function extractPdfText(file) {
  try { await loadPdfJs(); }
  catch (e) { toast("Couldn't load the PDF reader. Check your connection and try again."); return null; }
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer, isEvalSupported: false }).promise; // read locally; nothing is uploaded
  let fullText = '';
  const totalPages = pdf.numPages;
  const progressEl = document.getElementById('scanner-progress');
  const progressFill = document.getElementById('scanner-progress-fill');
  const progressText = document.getElementById('scanner-progress-text');
  if (progressEl) { progressEl.style.display = 'block'; }

  for (let i = 1; i <= totalPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const pageText = content.items.map(item => item.str).join(' ');
    fullText += pageText + '\n\n';
    if (progressFill) progressFill.style.width = ((i / totalPages) * 100) + '%';
    if (progressText) progressText.textContent = 'Reading page ' + i + ' of ' + totalPages + '...';
  }
  if (progressEl) { setTimeout(() => { progressEl.style.display = 'none'; }, 500); }
  return fullText.trim();
}

async function handlePdfUpload(file) {
  if (!file || file.type !== 'application/pdf') {
    toast('Please upload a PDF file.');
    return;
  }
  if (file.size > 20 * 1024 * 1024) {
    toast('File too large. Maximum size is 20MB.');
    return;
  }
  pdfExtracting = true;
  const textarea = document.getElementById('lease-text');
  const uploadZone = document.getElementById('upload-zone');
  if (uploadZone) uploadZone.innerHTML = '<div class="upload-icon" style="font-size:14px;color:rgba(255,255,255,0.5)">...</div><div class="upload-text">Extracting text from <strong>' + esc(file.name) + '</strong>...</div>';

  try {
    const text = await extractPdfText(file);
    if (text && text.length > 50) {
      if (textarea) textarea.value = text;
      toast('PDF text extracted (' + text.length.toLocaleString() + ' characters). Ready to scan!');
      trackScannerEvent('pdf_upload', { chars: text.length }); // no file names: they often contain a name or address
    } else {
      toast('Could not extract enough text from this PDF. It may be a scanned image. Try pasting the text manually.');
      trackScannerEvent('pdf_upload_fail', { reason: 'insufficient_text' });
    }
  } catch(err) {
    toast('Error reading PDF: ' + err.message);
    trackScannerEvent('pdf_upload_fail', { reason: err.message });
  }
  pdfExtracting = false;
  if (uploadZone) uploadZone.innerHTML = '<div class="upload-icon" style="font-size:24px;font-weight:700;color:rgba(255,255,255,0.3)">PDF</div><div class="upload-text"><strong>Click to upload</strong> or drag & drop your lease PDF<br>PDF files up to 20MB</div>';
}

function setupUploadZone() {
  setTimeout(() => {
    const zone = document.getElementById('upload-zone');
    const fileInput = document.getElementById('pdf-file-input');
    if (!zone || !fileInput) return;
    zone.addEventListener('click', () => fileInput.click());
    zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('dragover'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
    zone.addEventListener('drop', (e) => {
      e.preventDefault();
      zone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) handlePdfUpload(file);
    });
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) handlePdfUpload(file);
    });
  }, 50);
}

async function submitInterest() {
  const email = (document.getElementById('interest-email')?.value || '').trim();
  if (!EMAIL_RE.test(email)) { toast('Check your email address.'); return; }
  const btn = document.querySelector('.interest-modal .btn-primary');
  if (btn) btn.disabled = true;
  // The mailing list, with this box's wording kept as proof of consent (supabase/mailing.sql).
  // Before that file runs, the old waitlist table still works (and is moved onto the list later).
  let res;
  try { res = await db.rpc('rmc_join_list', { p_email: email, p_source: 'scanner' }); } catch (e) { res = { error: e }; }
  if (res && res.error && dbObjectMissing(res.error)) {
    try { res = await db.from('scanner_interest').insert({ email: email, source: 'scanner_popup' }); } catch (e) { res = { error: e }; }
  }
  if (btn) btn.disabled = false;
  if (res && res.error) { toast("Couldn't save that right now. Try again in a minute."); return; }
  trackScannerEvent('interest_submitted', {}); // never the address or its domain
  toast("You're on the list. Every email has an unsubscribe link.");
  closeInterestPopup();
}

function looksLikeLease(text) {
  // Must have minimum length — real leases are long
  if (text.length < 200) return { valid: false, reason: 'Too short — paste at least a few paragraphs from your lease.' };
  // Check for lease-related keywords
  const leaseWords = ['tenant','landlord','lease','rent','security deposit','premises','agreement',
    'occupant','property','termination','notice','maintenance','utilities','move-in','move-out',
    'monthly','payment','term','renewal','violation','eviction','damages','repair','unit','apartment',
    'bedroom','bathroom','parking','pet','sublease','assignee','lessee','lessor','dwelling','occupancy'];
  const lower = text.toLowerCase();
  const matchCount = leaseWords.filter(w => lower.includes(w)).length;
  if (matchCount < 3) return { valid: false, reason: "This doesn't look like a lease. Paste the actual text from your lease agreement and we'll flag anything sketchy." };
  // Check for excessive repetition (spam detection)
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  if (lines.length >= 3) {
    const uniqueLines = new Set(lines);
    if (uniqueLines.size / lines.length < 0.3) return { valid: false, reason: "Looks like repeated text. Paste your actual lease agreement to get a real scan." };
  }
  return { valid: true };
}

function runScan() {
  const text = document.getElementById('lease-text')?.value?.trim();
  if (!text || text.length < 50) {
    toast('Please paste your lease text (at least a few paragraphs).');
    return;
  }
  const check = looksLikeLease(text);
  if (!check.valid) {
    toast(check.reason);
    trackScannerEvent('scan_rejected', { reason: check.reason, text_length: text.length });
    return;
  }
  scannerClicks++;
  scanResults = scanLease(text);
  // Track scan event
  trackScannerEvent('scan_executed', {
    text_length: text.length,
    flags_found: scanResults.length,
    high_flags: scanResults.filter(f => f.severity === 'high').length,
    medium_flags: scanResults.filter(f => f.severity === 'medium').length,
    low_flags: scanResults.filter(f => f.severity === 'low').length,
    scan_number: scannerClicks
  });
  render();
  // Scroll to results
  setTimeout(() => {
    const el = document.getElementById('scan-results');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}

function launchConfetti() {
  var canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999';
  document.body.appendChild(canvas);
  var ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  var pieces = [];
  var colors = ['#FF5F05','#16A34A','#3B82F6','#EAB308','#EC4899','#8B5CF6','#F97316','#14B8A6'];
  for (var i = 0; i < 120; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height * -1,
      w: Math.random() * 10 + 5,
      h: Math.random() * 6 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 4,
      vy: Math.random() * 3 + 2,
      rot: Math.random() * 360,
      rotV: (Math.random() - 0.5) * 10,
      opacity: 1
    });
  }
  var frame = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    var alive = false;
    pieces.forEach(function(p) {
      if (p.opacity <= 0) return;
      alive = true;
      p.x += p.vx;
      p.vy += 0.05;
      p.y += p.vy;
      p.rot += p.rotV;
      if (frame > 60) p.opacity -= 0.01;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.globalAlpha = Math.max(0, p.opacity);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    frame++;
    if (alive && frame < 200) requestAnimationFrame(draw);
    else canvas.remove();
  }
  requestAnimationFrame(draw);
}

function quizScore(landlord) {
  var stats = getLandlordStats(landlord);
  if (stats.reviews === 0) return -1;
  var score = 0;
  // Base: overall rating (0-100)
  score += (stats.rating / 5) * 30;
  // Would rent again
  score += stats.wouldRent * 0.2;
  // Priority bonus
  var prio = quizAnswers.priority;
  if (prio && stats.scores[prio] > 0) score += (stats.scores[prio] / 5) * 20;
  // Budget fit
  var budget = quizAnswers.budget;
  if (budget) {
    var revs = getReviewsForLandlord(landlord).filter(function(r){ return isValidRent(r.monthlyRent); });
    if (revs.length > 0) {
      var avgRent = revs.reduce(function(s,r){return s+r.monthlyRent;},0) / revs.length;
      if (avgRent <= budget) score += 15;
      else score -= Math.min(15, (avgRent - budget) / 50 * 5);
    }
  }
  // Dealbreaker penalty
  var db = quizAnswers.dealbreaker;
  if (db) {
    var tags = getSmartTags(landlord);
    var badTags = tags.filter(function(t){ return t.type === 'bad' || t.type === 'warn'; });
    badTags.forEach(function(t) {
      if (db === 'pests' && t.tag === 'Pest Issues') score -= 25;
      if (db === 'fees' && (t.tag === 'Security Deposit Issues' || t.tag === 'Overpriced')) score -= 25;
      if (db === 'maintenance' && (t.tag === 'Slow Repairs')) score -= 25;
      if (db === 'noise' && t.tag === 'Noisy') score -= 25;
    });
  }
  // Vibe bonus
  var vibe = quizAnswers.vibe;
  if (vibe) {
    var tags2 = getSmartTags(landlord);
    tags2.forEach(function(t) {
      if (vibe === 'quiet' && t.tag === 'Quiet Building') score += 10;
      if (vibe === 'modern' && t.tag === 'Clean & Modern') score += 10;
    });
    if (vibe === 'quiet' && stats.scores.communication >= 3.5) score += 5;
    if (vibe === 'cheap') {
      var crevs = getReviewsForLandlord(landlord).filter(function(r){ return isValidRent(r.monthlyRent); });
      if (crevs.length > 0) {
        var cr = crevs.reduce(function(s,r){return s+r.monthlyRent;},0) / crevs.length;
        if (cr < 700) score += 10;
      }
    }
  }
  return Math.max(0, Math.round(score));
}

    '<p style="font-size:14px;color:var(--text);line-height:1.7;margin-top:10px"><strong>How the ranking works.</strong> When sorting by Highest Rated or Would Rent Again, landlords with at least 3 reviews are ranked first, and landlords with 1 or 2 reviews are listed after them as <strong>Early reads</strong>, with no verdict like Awesome or Awful. Within each group, every landlord starts with 3 "virtual" reviews at the site-wide average, so a single 5-star (or 1-star) review can\'t decide the order.</p>' +

    '<h3 style="font-size:18px;font-weight:800;color:var(--orange);margin-bottom:10px">Sub-Scores</h3>' +
    '<p style="font-size:14px;color:var(--text);line-height:1.7">Reviewers rate four dimensions on a 1-5 scale: <strong>Maintenance</strong> (speed and quality of repairs), <strong>Communication</strong> (responsiveness and clarity), <strong>Fairness</strong> (pricing, fees, and deposit handling), and <strong>Move-Out</strong> (ease of move-out process and deposit return). Each sub-score is the average of all ratings in that category.</p>' +

    '<p style="font-size:14px;color:var(--text);line-height:1.7">Every reviewer answers a simple yes/no: "Would you rent from this landlord again?" The percentage shown is the fraction of reviewers who said yes. This is often the most telling metric — it cuts through nuance and tells you whether tenants would actually go back.</p>' +
  '</div>' +

    '<p style="font-size:14px;color:var(--text);line-height:1.7">The sparkline chart shows how a landlord\'s ratings have changed over time. Each point is one review plotted chronologically. The trend arrow compares the average of the newer half of reviews to the older half. A green upward arrow means they\'re improving; red downward means they\'re slipping. Trends only appear once a landlord has at least 5 reviews; with fewer, one review swings the line too much to mean anything.</p>' +

  '</div>' +

  '</div>';
}

function VerifyBlockHTML() {

      '<div class="verify-row"><input type="text" id="rev-verify-code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="123456" onkeydown="if(event.key===\'Enter\'){event.preventDefault();checkVerifyCode()}" />' +
      '<button type="button" class="verify-btn" onclick="checkVerifyCode()"' + (v.busy ? ' disabled' : '') + '>' + (v.busy ? 'Checking…' : 'Verify') + '</button></div>' + msg +
      '<p class="verify-msg">It can take a minute; check Junk too. <button type="button" class="verify-link" onclick="changeVerifyEmail()">Use a different email</button> · ' +
      '<button type="button" class="verify-link" onclick="sendVerifyCode(true)">Send a new code</button></p></div>';
  }
  return '<div class="field verify-box"><label for="rev-verify-email" class="verify-title">' + badge + 'Get the Verified Illini badge <span class="verify-opt">(optional, recommended)</span></label>' +
    '<p class="verify-msg">Verified reviews carry more weight with readers and keep fake reviews out. We email you a code. By verifying, you agree we can keep your email to send occasional RateMyCrib updates; unsubscribe anytime. It is never shown, never attached to your review, and never shared with landlords.</p>' +
    '<div class="verify-row"><input type="email" id="rev-verify-email" autocomplete="email" placeholder="netid@illinois.edu" value="' + esc(v.email || '') + '" onkeydown="if(event.key===\'Enter\'){event.preventDefault();sendVerifyCode()}" />' +
    '<button type="button" class="verify-btn" onclick="sendVerifyCode()"' + (v.busy ? ' disabled' : '') + '>' + (v.busy ? 'Sending…' : 'Send code') + '</button></div>' + msg + '</div>';
}
// Optional "Email for updates": no code, no badge. Hidden once the student has verified (that email is used).
function UpdatesEmailHTML() {
  if (S.verify && S.verify.stage === 'verified') return '';
  return '<div class="field"><label for="rev-updates-email">Email for updates <span style="font-weight:400;color:var(--muted)">(optional)</span></label>' +

function verifyRender(patch) {
  saveFormState();
  S.verify = Object.assign({}, S.verify || {}, patch);
  go({});
}
function changeVerifyEmail() { verifyRender({ stage: 'idle', error: '' }); }
async function sendVerifyCode(again) {
  const input = document.getElementById('rev-verify-email');
  const email = ((input ? input.value : (S.verify && S.verify.email)) || '').trim().toLowerCase();
  if (!/^[^\s@]+@illinois\.edu$/.test(email)) {
    verifyRender({ stage: 'idle', email, error: 'Use your @illinois.edu address (like netid@illinois.edu).' });
    return;
  }
  verifyRender({ stage: again ? 'sent' : 'idle', email, busy: true, error: '' });
  let error = null;
  try { ({ error } = await db.auth.signInWithOtp({ email, options: { shouldCreateUser: true } })); } catch (e) { error = e; }
  if (error) {
    const status = error.status || 0;
    const reason = status === 429 || /rate|seconds/i.test(error.message || '') ? 'rate_limited' : 'send_failed';
    // error.code (e.g. "email_address_not_authorized" = the project's email sender isn't set up) tells the
    // dashboard why codes fail; it says nothing about the student
    trackEvent('verify_failed', { reason, status, code: String(error.code || '').slice(0, 40) });
    verifyRender({ stage: again ? 'sent' : 'idle', busy: false, error: reason === 'rate_limited'
      ? 'Too many codes asked for. Wait a few minutes, then try again, or post without the badge.'
      : "We couldn't send a code right now. Your review still posts without the badge, or try again later." });
    return;
  }
  trackEvent('verify_code_sent', { again: !!again });
  verifyRender({ stage: 'sent', email, busy: false, error: '' });
  setTimeout(() => { const c = document.getElementById('rev-verify-code'); if (c) c.focus(); }, 50);
}
async function checkVerifyCode() {
  const v = S.verify || {};
  const token = ((document.getElementById('rev-verify-code') || {}).value || '').replace(/\D/g, '');
  if (token.length < 6) { verifyRender({ error: 'Enter the 6-digit code from the email.' }); return; }
  verifyRender({ busy: true, error: '' });
  let error = null, data = null;
  try { ({ data, error } = await db.auth.verifyOtp({ email: v.email, token, type: 'email' })); } catch (e) { error = e; }
  if (error || !data || !data.session) {
    trackEvent('verify_failed', { reason: 'bad_code' });
    verifyRender({ busy: false, error: "That code didn't work. Use the newest email, or send a new code." });
    return;
  }
  trackEvent('verify_success');
  try { await db.rpc('rmc_save_contact'); } catch (e) {} // kept apart from the review (see the privacy policy)
  verifyRender({ stage: 'verified', busy: false, error: '' });
}
async function undoVerify() {
  try { await db.rpc('rmc_forget_verification'); } catch (e) {} // the address saved a moment ago, nothing older
  try { await db.auth.signOut(); } catch (e) {}
  verifyRender({ stage: 'idle', busy: false, error: '' });
}

function toggleTag(type, tag) {
  if (type === 'pos') {
    if (S.posTags.includes(tag)) S.posTags = S.posTags.filter(t => t !== tag);
    else S.posTags = [...S.posTags, tag];
  } else {
    if (S.negTags.includes(tag)) S.negTags = S.negTags.filter(t => t !== tag);
    else S.negTags = [...S.negTags, tag];
  }
  // Update DOM directly — no re-render needed for tags
  const selector = type === 'pos' ? '#pos-tags .chip' : '#neg-tags .chip';
  document.querySelectorAll(selector).forEach(el => {
    const cls = type === 'pos' ? 'sel-pos' : 'sel-neg';
    const arr = type === 'pos' ? S.posTags : S.negTags;
    if (arr.includes(el.dataset.tag)) el.classList.add(cls);
    else el.classList.remove(cls);
  });
}

function onLandlordChange(sel) {
  const customInput = document.getElementById('rev-landlord-custom');
  const suggestBox = document.getElementById('landlord-suggestions');
  if (sel.value === '__other__') {

    if (suggestBox) suggestBox.style.display = 'none';

  const addrInput = document.getElementById('rev-property-custom');
  if (addrInput && addrInput.value.trim()) onAddressInput(addrInput);
}

// Fires as the user types their address (debounced 300ms).
// If the address matches a known property, show a hint and optionally
// auto-correct the landlord dropdown.
let _addrDebounce = null;
function onAddressInput(input) {
  clearTimeout(_addrDebounce);

function _doAddressCheck(input) {
  const hint = document.getElementById('addr-match-hint');
  if (!hint) return;
  const addr = input.value.trim();
  if (addr.length < 4) { hint.style.display = 'none'; return; }

  const match = matchAddressToLandlord(addr);
  if (!match) { hint.style.display = 'none'; return; }

  // Check what landlord is currently selected — either from dropdown or detail page
  const sel = document.getElementById('rev-landlord');
  const isDetailPage = !sel; // No dropdown = reviewing from a landlord detail page
  let currentLid = 0;
  let currentVal = '';

  if (sel) {
    currentVal = sel.value;
    currentLid = currentVal.startsWith('user_') ? parseInt(currentVal.replace('user_','')) : parseInt(currentVal);
  } else {
    // Detail page: the landlord ID is embedded in the submit button's onclick
    // Pull from S.detail which holds the current landlord ID
    currentLid = S.detail || 0;
    currentVal = String(currentLid);
  }

  const srcLabel = match.source === 'verified' ? '' : ' (based on other reviews)';

  if (currentLid === match.landlordId) {

    hint.innerHTML = '\u2705 This address is managed by <strong>' + esc(match.landlordName) + '</strong>' + srcLabel + ' — matches your selection.';
  } else if (!currentVal || currentVal === '') {
    // No landlord selected yet — auto-select for them
    if (sel) sel.value = String(match.landlordId);
    hint.style.display = 'block';
    hint.style.background = 'rgba(33,150,243,0.12)';
    hint.style.color = '#1565c0';
    hint.innerHTML = 'We recognized this address' + srcLabel + ' — auto-selected <strong>' + esc(match.landlordName) + '</strong>. You can change this if it\'s wrong.';
    // Hide custom landlord input if it was showing
    const customInput = document.getElementById('rev-landlord-custom');
    const suggestBox = document.getElementById('landlord-suggestions');
    if (customInput) customInput.style.display = 'none';
    if (suggestBox) suggestBox.style.display = 'none';
  } else {
    // Different landlord selected — orange suggestion (never blocking)
    hint.style.display = 'block';
    hint.style.background = 'rgba(255,152,0,0.15)';
    hint.style.color = '#e65100';
    if (isDetailPage) {
      // Can't switch landlord on detail page — just inform
      hint.innerHTML = '\u26A0\uFE0F Heads up: this address is typically managed by <strong>' + esc(match.landlordName) + '</strong>' + srcLabel
        + '. If you want to review under that landlord instead, go back and find their page. Otherwise, continue — you know your landlord best!';
    } else {
      hint.innerHTML = '\u26A0\uFE0F Other students report this address is managed by <strong>' + esc(match.landlordName) + '</strong>' + srcLabel + '. If that\'s correct, '
        + '<a href="#" onclick="event.preventDefault();var s=document.getElementById(\'rev-landlord\');if(s)s.value=\'' + match.landlordId + '\';onAddressInput(document.getElementById(\'rev-property-custom\'));return false;" style="color:#e65100;font-weight:700;text-decoration:underline">switch to ' + esc(match.landlordName) + '</a>'
        + '. Otherwise, keep your selection — you know your landlord best!';
    }
  }
}

function fuzzyMatch(query, target) {
  const q = query.toLowerCase();
  const t = target.toLowerCase();
  if (t.includes(q)) return true;
  // Check individual words
  const words = q.split(/\s+/);
  return words.every(w => t.includes(w));
}

function onCustomLandlordInput(input) {
  const val = input.value.trim();

  if (!suggestBox) return;

  // Build full list of existing landlords
  const allNames = [
    ...SEED_LANDLORDS.map(x => ({ name: x.name, value: String(x.id), type: 'seed' })),
    ...(userLandlords || []).map(x => ({ name: x.name, value: 'user_' + x.id, type: 'user' }))
  ];

  const matches = allNames.filter(x => fuzzyMatch(val, x.name)).slice(0, 5);

  if (matches.length === 0) { suggestBox.style.display = 'none'; return; }

  suggestBox.innerHTML = '<div style="font-size:11px;color:var(--muted);padding:6px 12px">Did you mean one of these?</div>' +

    ).join('');

// One submission at a time: a double tap used to post the review (and a new landlord) twice
let _reviewSubmitting = false;
async function submitReview(landlordIdFromDetail) {
  if (_reviewSubmitting) return;

  try { await submitReviewOnce(landlordIdFromDetail); }
  finally {
    _reviewSubmitting = false;
    const b = document.querySelector('.submit-btn');
    if (b && S.modal) { b.disabled = S.stars === 0; b.textContent = 'Post My Review Anonymously'; }

// "J.S.M. Living" and "jsm  living" are the same landlord (same rule as the database)
const landlordKey = n => String(n || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
// A landlord that isn't listed yet: reuse a matching one, otherwise add it. Returns { id, name } or { message }.
async function addUserLandlord(name) {
  const k = landlordKey(name);
  const same = SEED_LANDLORDS.find(x => landlordKey(x.name) === k) || (userLandlords || []).find(x => landlordKey(x.name) === k);
  if (same) return { id: same.id, name: same.name };
  let res;
  try { res = await db.from('user_landlords').insert({ name }).select('id,name'); } catch (e) { res = { error: e }; }
  const { data, error } = res || {};
  if (data && data[0]) { userLandlords.push(data[0]); return { id: data[0].id, name: data[0].name }; }
  if (error && error.hint === 'duplicate_landlord' && /^\d+$/.test(String(error.details || ''))) {
    const id = parseInt(error.details, 10);
    try { const r = await db.from('user_landlords').select('id,name').eq('id', id); if (r.data && r.data[0]) { userLandlords.push(r.data[0]); return { id, name: r.data[0].name }; } } catch (e) {}
    return { id, name };
  }
  if (error && (error.hint === 'landlord_name' || error.hint === 'rate_limited') && error.message) return { message: error.message };
  return { message: "Couldn't add that landlord right now. Try again in a minute, or pick one from the list." };
}
async function submitReviewOnce(landlordIdFromDetail) {
  // Handle landlord selection — could be seed, user-submitted, or custom new
  let landlordId = landlordIdFromDetail;
  let landlordName = '';
  let isCustomLandlord = false;

  if (!landlordId) {
    const landlordSelect = document.getElementById('rev-landlord');
    const landlordVal = landlordSelect?.value || '';
    const landlordCustom = document.getElementById('rev-landlord-custom')?.value?.trim() || '';

    if (landlordVal === '__other__') {
      if (!landlordCustom) { toast('Please type your landlord\'s name.'); return; }
      if (landlordCustom.length < 3) { toast('Landlord name is too short. Please enter the full name.'); return; }
      // Check for fuzzy match one more time before creating a new entry
      const allExisting = [
        ...SEED_LANDLORDS.map(x => ({ name: x.name, value: String(x.id) })),
        ...(userLandlords || []).map(x => ({ name: x.name, value: 'user_' + x.id }))
      ];
      const closeMatches = allExisting.filter(x => fuzzyMatch(landlordCustom, x.name));
      if (closeMatches.length > 1 && S._ambiguousName !== landlordCustom) {
        S._ambiguousName = landlordCustom; // asking once: submit again with the same name to add it as new
        const custom = document.getElementById('rev-landlord-custom');
        if (custom) onCustomLandlordInput(custom);
        toast(closeMatches.length + ' listed landlords match "' + landlordCustom + '": ' + closeMatches.slice(0, 3).map(x => x.name).join(', ') + (closeMatches.length > 3 ? '…' : '') + '. Pick yours from the suggestions, or post again to add it as a new landlord.');
        return;
      }
      const closeMatch = closeMatches.length === 1 ? closeMatches[0] : null;
      if (closeMatch && !confirm(`"${closeMatch.name}" is already listed and looks similar. Click OK to use the existing listing, or Cancel to add "${landlordCustom}" as a new landlord.`)) {
        isCustomLandlord = true;
        landlordName = landlordCustom;
        landlordId = -1;
      } else if (closeMatch) {
        // User chose the existing match
        const sel = document.getElementById('rev-landlord');
        if (sel) sel.value = closeMatch.value;
        landlordId = closeMatch.value.startsWith('user_') ? parseInt(closeMatch.value.replace('user_','')) : parseInt(closeMatch.value);
        landlordName = closeMatch.name;
        isCustomLandlord = false;
      } else {
        isCustomLandlord = true;
        landlordName = landlordCustom;
        landlordId = -1; // placeholder
      }
    } else if (landlordVal.startsWith('user_')) {
      const ul = userLandlords.find(x => 'user_' + x.id === landlordVal);
      landlordId = parseInt(landlordVal.replace('user_', ''));
      landlordName = ul ? ul.name : '';
    } else {
      landlordId = parseInt(landlordVal);
      const match = findLandlord(landlordId);
      landlordName = match ? match.name : '';
    }
  } else {
    const match = findLandlord(landlordId);
    landlordName = match ? match.name : '';
  }

  if (!landlordId && !isCustomLandlord) { toast('Please select a landlord.'); return; }
  if (S.stars === 0) { toast('Please select a star rating (1-5 stars).'); return; }
  if (S.wouldRentChoice === null) { toast('Please answer: would you rent from them again?'); return; }
  if (!document.getElementById('rev-certify')?.checked) { toast('Please certify that you are a real tenant, not a landlord or property manager.'); return; }

  const propCustom = stripUnit(document.getElementById('rev-property-custom')?.value?.trim() || ''); // keep reviewers anonymous: no unit numbers

  // Soft mismatch warning — only warns if address is known to belong to a DIFFERENT landlord
  if (!isCustomLandlord && propCustom.length >= 4) {
    const addrMatch = matchAddressToLandlord(propCustom);
    if (addrMatch && addrMatch.landlordId !== landlordId && addrMatch.source === 'verified') {
      const proceed = confirm(
        'Heads up: "' + propCustom + '" is usually managed by ' + addrMatch.landlordName +
        '. You selected ' + landlordName + '.\n\n' +
        'OK to submit as-is, or Cancel to change.'
      );
      if (!proceed) return;
    }
    // No warning for unknown addresses — we don't have every property mapped
  }

  const text = document.getElementById('rev-text')?.value?.trim();
  if (!text || text.length < 20) { toast('Please write at least a sentence (20+ characters) about your experience.'); document.getElementById('rev-text')?.focus(); return; }

  // One review per lease, so the lease start is required; the end is optional
  const leaseStart = document.getElementById('rev-lease-start')?.value || '';
  const leaseEnd = document.getElementById('rev-lease-end')?.value || '';
  if (leaseTermIndex(leaseStart) < 0) { toast('Pick when this lease started. You can review the same landlord again for a different lease.'); document.getElementById('rev-lease-start')?.focus(); return; }
  if (leaseEnd && leaseTermIndex(leaseEnd) < leaseTermIndex(leaseStart)) { toast('The lease end is before the start. Check the dates.'); document.getElementById('rev-lease-end')?.focus(); return; }
  const leasePeriod = leaseEnd ? leaseStart + ' – ' + leaseEnd : 'from ' + leaseStart;
  const fullText = `[Lease: ${leasePeriod}] ${text}`;
  if (fullText.length > 5000) { toast('Review text is too long (max ' + (5000 - fullText.length + text.length).toLocaleString() + ' characters).'); return; }

  const rentInput = document.getElementById('rev-rent')?.value;
  const monthlyRentVal = parseInt(rentInput) || 0;
  const updatesEmail = (document.getElementById('rev-updates-email')?.value || '').trim();
  if (updatesEmail && !/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(updatesEmail)) { toast('Check your email address, or leave it blank.'); document.getElementById('rev-updates-email')?.focus(); return; }
  if (rentInput && monthlyRentVal > 0 && !isValidRent(monthlyRentVal)) { const det = document.getElementById('rev-details'); if (det) { det.open = true; S.revDetailsOpen = true; } toast('Monthly rent should be between $' + MIN_RENT + ' and $' + MAX_RENT.toLocaleString() + ' per person.'); return; }

  const property = propCustom || 'Not specified';

  // Collect rent + neighborhood ratings
  const monthlyRent = monthlyRentVal;
  const hoodSafety = parseInt(document.getElementById('rev-hood-safety')?.value) || 0;
  const hoodWalk = parseInt(document.getElementById('rev-hood-walk')?.value) || 0;
  const hoodQuiet = parseInt(document.getElementById('rev-hood-quiet')?.value) || 0;
  const hoodNightlife = parseInt(document.getElementById('rev-hood-nightlife')?.value) || 0;

  // Neighborhood comes from the dropdown
  const hoodRaw = document.getElementById('rev-hood-select')?.value || '';
  const hoodName = hoodRaw === '__other__' ? '' : hoodRaw;

  // Collect selected tags from state
  const posTags = [...S.posTags];
  const negTags = [...S.negTags];

  // One review per lease: checked before anything is saved (a stopped review used to leave its landlord behind)
  if (!isCustomLandlord && !leaseCheckOk(landlordId, landlordName, leaseStart)) return;

  const btn = document.querySelector('.submit-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Submitting...'; }

  // A landlord that isn't listed: add it (or reuse the matching one). Without an id the review would land nowhere.
  if (isCustomLandlord && landlordName) {
    const added = await addUserLandlord(landlordName);
    if (!added.id) { toast(added.message); return; }
    landlordId = added.id; landlordName = added.name; isCustomLandlord = false;
    if (!leaseCheckOk(landlordId, landlordName, leaseStart)) return;
  }

  // (The address travels with the review itself; it used to be copied into a separate list nothing read.)

  const review = {
    landlordId: landlordId,
    property: property,
    author: 'Anonymous Student', // the database sets "Verified Illini" itself, only after a real email code
    rating: S.stars,
    wouldRent: S.wouldRentChoice === true,
    text: fullText,
    leaseStart: leaseStart,
    pos: posTags,
    neg: negTags,
    monthlyRent: monthlyRent,
    hoodName: hoodName,
    hoodSafety: hoodSafety,
    hoodWalkability: hoodWalk,
    hoodQuiet: hoodQuiet,
    hoodNightlife: hoodNightlife,
    scoreMaintenance: parseInt(document.getElementById('rev-score-maintenance')?.value) || 0,
    scoreCommunication: parseInt(document.getElementById('rev-score-communication')?.value) || 0,
    scoreFairness: parseInt(document.getElementById('rev-score-fairness')?.value) || 0,
    scoreMoveOut: parseInt(document.getElementById('rev-score-moveout')?.value) || 0,
    landlordName: landlordName || '',
    depositBack: S.depositChoice || null,
    leaseChecked: true,
  };

  const wasVerified = !!(S.verify && S.verify.stage === 'verified');
  const success = await saveReviewToDb(review);
  if (success === true) {
    if (updatesEmail && !wasVerified) { await joinList(updatesEmail, 'review_form'); } // own request, after the review
    if (wasVerified) { try { await db.auth.signOut(); } catch (e) {} }
    S.verify = null;
    // Not in the public list after reloading: it's waiting for a quick check (contact details, a burst, a repeat)
    const live = dbLoadError ? undefined : dbReviews.some(r => r.text === fullText);
    go({modal:false, stars:0, wouldRentChoice:null, depositChoice:null, _submitted:true});
    trackEvent('review_submitted', { verified: wasVerified });
    launchConfetti();
    showSharePromptEnhanced(landlordName, review, live);
  } else {
    if (success !== 'shown') toast('Something went wrong. Try again.');
  }
}

  if (helped[reviewId]) {

    removeHelpful(reviewId);
    if (existing) existing.helpful = Math.max(0, (existing.helpful || 0) - 1);
    btn.style.borderColor = '';
    btn.style.color = '';
    btn.textContent = 'Helpful (' + (existing ? existing.helpful : 0) + ')';
    try { await db.rpc('adjust_helpful', { p_review_id: reviewId, p_delta: -1 }); } catch(e) { /* silent */ }

  if (existing) existing.helpful = (existing.helpful || 0) + 1;

  btn.textContent = 'Helpful (' + (existing ? existing.helpful : 1) + ')';
  await incrementHelpful(reviewId);
}

async function submitReport(reviewId, reason, btn) {
  // Close modal
  var overlay = btn.closest('div').parentElement.parentElement;
  if (overlay) overlay.remove();
  // Remember on this device that it was reported (just the review id, not why)
  var reported = loadReported();
  reported[reviewId] = 1;
  try { localStorage.setItem('ratemycrib_reported', JSON.stringify(reported)); } catch (e) {}
  // Update button in the review
  var reportBtns = document.querySelectorAll('.review-actions button:last-child');
  reportBtns.forEach(function(b) {
    if (b.getAttribute('onclick') && b.getAttribute('onclick').includes(reviewId)) {
      b.style.borderColor = '#DC2626';
      b.style.color = '#DC2626';
      b.innerHTML = 'Reported';
    }
  });
  // Send to Supabase: the review and the reason only (the database adds the time)
  let ok = false;
  try { const { error } = await db.from('reported_reviews').insert({ review_id: reviewId, reason: reason }); ok = !error; } catch(e) {}
  toast(ok ? 'Thanks. We look at every report, usually within a few days.' : "Couldn't send that report. Email ratemycrib@proton.me and we'll look at it.");
}

function copyShareLink() {
  const url = window.location.href;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => toast('Link copied! Share it with your friends.'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = url;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('Link copied! Share it with your friends.');
  }
}

function enhanceClickables(root) {

  if ((role !== 'button' && role !== 'link') || el.matches('a[href], button, input, select, textarea, summary')) return;

function animateHeroCounts() {
  var els = document.querySelectorAll('.hero-countup');
  if (!els.length) return;
  els.forEach(function(el) {
    var target = parseInt(el.getAttribute('data-target')) || 0;
    if (target === 0) return;
    var duration = 1200; // ms
    var start = null;
    var startVal = 0;
    function step(ts) {
      if (!start) start = ts;
      var progress = Math.min((ts - start) / duration, 1);
      // Ease-out cubic for a satisfying deceleration
      var eased = 1 - Math.pow(1 - progress, 3);
      var current = Math.round(startVal + (target - startVal) * eased);
      el.textContent = current;
      if (progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}
