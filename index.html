    if (l) {
      var stats = getLandlordStats(l);
      var ratingText = stats.reviews >= 3 ? ' — ' + stats.rating.toFixed(1) + '/5 (' + stats.reviews + ' reviews)' : stats.reviews > 0 ? ' — ' + stats.rating.toFixed(1) + '/5' : '';
      document.title = l.name + ' Reviews' + ratingText + ' | ' + base;
      return;
    }
  }
  if (S.page === 'hoods') document.title = 'UIUC Neighborhoods — Housing by Area | ' + base;
  else if (S.page === 'streets') document.title = 'Browse UIUC Housing Reviews by Street | ' + base;
  else if (S.page === 'compare') document.title = 'Compare UIUC Landlord Prices | ' + base;
  else if (S.page === 'h2h') document.title = 'Head-to-Head Landlord Comparison | ' + base;
  else if (S.page === 'scanner') document.title = 'Free Illinois Lease Scanner | ' + base;
  else if (S.page === 'insights') document.title = 'UIUC Housing Insights & Data | ' + base;
  else if (S.page === 'quiz') document.title = 'Find My Crib — Housing Match Quiz | ' + base;
  else if (S.page === 'rentcheck') document.title = 'Am I Overpaying? — Rent Check | ' + base;
  else document.title = 'UIUC Landlord Reviews by Students | ' + base;
}

function updateMetaDescription() {
  var meta = document.querySelector('meta[name="description"]');
  if (!meta) return;
  if (S.page === 'detail' && S.detail) {
    var l = findLandlord(S.detail);
    if (l) {
      var stats = getLandlordStats(l);
      if (stats.reviews >= 3) {
        meta.content = 'Read ' + stats.reviews + ' student reviews of ' + l.name + '. Rated ' + stats.rating.toFixed(1) + '/5 for maintenance, communication, fairness, and move-out. ' + stats.wouldRent + '% would rent again.';
      } else if (stats.reviews > 0) {
        meta.content = 'Student reviews of ' + l.name + '. Rated ' + stats.rating.toFixed(1) + '/5 for maintenance, communication, fairness, and move-out on RateMyCrib.';
      } else {
        meta.content = l.name + ' — UIUC landlord on RateMyCrib. Be the first to leave a review and help other students.';
      }
      return;
    }
  }
  if (S.page === 'hoods') meta.content = 'Browse UIUC off-campus housing by neighborhood — Campustown, Green St, Urbana, and more. See safety, walkability, and nightlife scores.';
  else if (S.page === 'streets') meta.content = 'Pick the streets near your classes and see every reviewed building on them, with student ratings, rent, and reviews.';
  else if (S.page === 'scanner') meta.content = 'Free Illinois lease scanner. Upload your lease PDF and we\'ll flag clauses that may conflict with Illinois tenant law.';
  else meta.content = 'The honest guide to off-campus housing at UIUC. Search landlords, read real student reviews, and compare prices. By students, for students.';
}

function updateStructuredData() {
  // Remove existing dynamic LD+JSON
  var existing = document.getElementById('dynamic-jsonld');
  if (existing) existing.remove();

  if (S.page === 'detail' && S.detail) {
    var l = findLandlord(S.detail);
    if (!l) return;
    var stats = getLandlordStats(l);
    if (stats.reviews === 0) return;

    var ld = {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": l.name,
      "description": "UIUC landlord/management company reviewed by students on RateMyCrib",
      "url": "https://ratemycrib.net/landlord/" + landlordSlug(l) + "/",
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": stats.rating.toFixed(1),
        "bestRating": "5",
        "worstRating": "1",
        "ratingCount": String(stats.reviews)
      },
      "areaServed": {
        "@type": "City",
        "name": "Champaign-Urbana",
        "containedInPlace": { "@type": "State", "name": "Illinois" }
      }
    };
    var script = document.createElement('script');
    script.type = 'application/ld+json';
    script.id = 'dynamic-jsonld';
    script.textContent = JSON.stringify(ld);
    document.head.appendChild(script);
  }
}

// Parse initial URL hash on page load
(function() {
  var hash = location.hash.slice(1);
  if (hash.startsWith('landlord/')) {
    var slug = hash.split('/')[1];
    var found = findLandlordBySlug(slug);
    var wantsRate = hash.split('/')[2] === 'rate';
    if (found) {
      S.page = 'detail'; S.detail = found.id;
      // #landlord/<slug>/rate opens the review form with this landlord picked (used by /landlord/<slug>/ pages and shared review links)
      if (wantsRate) {
        S.modal = true;
        try { history.replaceState(null, '', location.pathname + location.search + '#landlord/' + slug); } catch (e) {}
      }
    } else if (slug) {
      _pendingLandlordHash = { slug: slug, rate: wantsRate }; // maybe a student-added landlord: retried once they load
      if (wantsRate) { S.modal = true; }                     // the form opens now; the landlord is filled in when found
    }
  } else if (hash.startsWith('landlord-')) {
    var id = parseInt(hash.split('-')[1]);
    if (id) { S.page = 'detail'; S.detail = id; }
  } else if (hash === 'neighborhoods') { S.page = 'hoods'; }
  else if (hash === 'streets' || hash.startsWith('streets/')) { S.page = 'streets'; S.streets = hash.split('/')[1] ? hash.split('/')[1].split('+').filter(Boolean) : []; }
  else if (hash === 'compare') { S.page = 'compare'; }
  else if (hash === 'head-to-head' || hash === 'h2h') { S.page = 'h2h'; }
  else if (hash === 'scanner') { S.page = 'scanner'; }
  else if (hash === 'insights') { S.page = 'insights'; }
  else if (hash === 'quiz') { S.page = 'quiz'; }
  else if (hash === 'rentcheck') { S.page = 'rentcheck'; }
  else if (hash === 'rate') { S.page = 'home'; S.modal = true; }
})();

loadMajorChoice();
render();
updatePageTitle();
updateMetaDescription();
updateStructuredData();
if (ANALYTICS.isNew) {
  let q = null; try { q = new URLSearchParams(location.search); } catch (e) {}
  let ref = 'direct'; try { if (document.referrer) ref = new URL(document.referrer).origin; } catch (e) {}
  trackEvent('session_start', { referrer: ref, landing: S.page || 'home', source: ANALYTICS.src,
    utm_medium: q && q.get('utm_medium') ? q.get('utm_medium').slice(0, 40) : null,
    utm_campaign: q && q.get('utm_campaign') ? q.get('utm_campaign').slice(0, 60) : null });
}
// The page someone landed on counts as a view (only later navigation was counted before), and a form opened by
// a link (#rate, /landlord/<slug>/rate, flyers) counts as a form open
_lastTrackedPage = (S.page || 'home') + (S.detail ? '_' + S.detail : '');
trackEvent('page_view', { page: S.page || 'home', detail: S.detail || null });
if (S.modal) { trackEvent('review_modal_open', { source: 'link', landlord_id: S.detail || null }); syncFormHistory(); }
loadUserSubmissions(); // Load student-added landlords from Supabase

// Register service worker for PWA / Add to Home Screen
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(function(){});
}
</script>
</body>
</html>
