# One-off data pull for the "major + year" feature. Lives only on the data/catalog-snapshot branch.
name: Catalog snapshot
on:
  push:
    branches: [data/catalog-snapshot]
    paths: [tools/snapshot_catalog.py, .github/workflows/catalog-snapshot.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/snapshot_catalog.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog-raw
          git commit -m "Catalog snapshot $(date -u +%Y-%m-%d)" || echo "nothing new"
          git push
