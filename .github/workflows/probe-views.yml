# One-off read-only security probe (data branch only). Writes target an id that can't exist.
name: Probe views
on:
  push:
    branches: [data/catalog-snapshot]
    paths: [tools/probe_views.py, .github/workflows/probe-views.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: git fetch --depth=1 origin main && git show origin/main:index.html > index.html
      - run: python3 tools/probe_views.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe
          git commit -m "View probe $(date -u +%H:%M)" || echo "nothing new"
          git push
