# One-off data pull: graduate & professional programs for "Near your classes". Data branch only.
name: Graduate catalog snapshot
on:
  push:
    branches: [data/catalog-snapshot]
    paths: [tools/snapshot_grad_catalog.py, .github/workflows/grad-catalog-snapshot.yml]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/snapshot_grad_catalog.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog-raw-grad
          git commit -m "Graduate catalog snapshot $(date -u +%Y-%m-%d)" || echo "nothing new"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
