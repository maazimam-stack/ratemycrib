# One-off: geocode professional-school buildings (data branch only).
name: Geo extra
on:
  push:
    branches: [data/catalog-snapshot]
    paths: [tools/geo_extra.py, .github/workflows/geo-extra.yml]
permissions:
  contents: write
jobs:
  geo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/geo_extra.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geo-raw/extra.json
          git commit -m "Geo extra $(date -u +%H:%M)" || echo "nothing new"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
