# One-off read-only check that the live site serves the merged code (data branch only).
name: Check live site
on:
  push:
    branches: [data/catalog-snapshot]
    paths: [tools/check_live.py, .github/workflows/check-live.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_live.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe
          git commit -m "Live check $(date -u +%H:%M)" || echo "nothing new"
          git push
