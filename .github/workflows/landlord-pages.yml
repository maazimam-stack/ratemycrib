# Rebuilds the static landlord review pages (landlord/**) and sitemap.xml from the public reviews view,
# so search engines can index each landlord. Nightly, on demand, and when the builder changes.
name: Landlord pages
on:
  schedule:
    - cron: "17 9 * * *"   # daily, ~4am Chicago
  workflow_dispatch:
  push:
    branches: [main, seo/landlord-pages]
    paths: [tools/build_landlord_pages.py, .github/workflows/landlord-pages.yml]
permissions:
  contents: write
concurrency:
  group: landlord-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_landlord_pages.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add landlord sitemap.xml
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update landlord pages $(date -u +%Y-%m-%d)"
          git push
