// ===== Charts (hand-drawn SVG; one measure per chart, no second axis) =====
// Whole-number gridlines: a 1/2/5 x 10^k step, 3-5 lines
function niceScale(v) {
  const raw = Math.max(1, v) / 4, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
  const step = Math.max(1, (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p);
  return { step, max: step * Math.max(1, Math.ceil(Math.max(1, v) / step)) };
}
function chartSVG(id, rows, key, kind, color, label) {
  const W = 640, H = 200, L = 36, R = 8, T = 10, B = 26;
  const vals = rows.map(r => +r[key] || 0);
  const { step: tick, max } = niceScale(Math.max(1, ...vals));
  const n = rows.length, step = (W - L - R) / Math.max(1, n - (kind === 'line' ? 1 : 0));
  const x = i => kind === 'line' ? L + i * step : L + i * step + step / 2;
  const y = v => T + (H - T - B) * (1 - v / max);

  const every = Math.ceil(n / 6);
  rows.forEach((r, i) => { if (i % every === 0 || i === n - 1) g += '<text class="axis" x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(shortDate(r.day)) + '</text>'; });
  let marks = '';
  if (kind === 'line') {
    const d = vals.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
    marks = '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    if (n <= 31) marks += vals.map((v, i) => '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="2.5" fill="' + color + '"/>').join('');
  } else {
    const bw = Math.max(2, Math.min(18, step - 2));
    marks = vals.map((v, i) => {
      if (!v) return '';
      const h = Math.max(1, y(0) - y(v)), x0 = x(i) - bw / 2, y0 = y(v), rr = Math.min(4, bw / 2, h);
      return '<path d="M' + x0 + ' ' + y(0) + 'V' + (y0 + rr) + 'Q' + x0 + ' ' + y0 + ' ' + (x0 + rr) + ' ' + y0 + 'H' + (x0 + bw - rr) + 'Q' + (x0 + bw) + ' ' + y0 + ' ' + (x0 + bw) + ' ' + (y0 + rr) + 'V' + y(0) + 'Z" fill="' + color + '"/>';
    }).join('');
  }
  return '<div class="chart" id="' + id + '" data-kind="' + kind + '" data-key="' + key + '" data-label="' + esc(label) + '" data-color="' + color + '">' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(label) + ' per day, last ' + A.days + ' days">' + g +
    '<line class="baseline" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(0) + '" y2="' + y(0) + '"/>' + marks +
    '<line class="cross" x1="0" x2="0" y1="' + T + '" y2="' + y(0) + '" visibility="hidden"/>' +
    '<rect class="hit" x="' + L + '" y="0" width="' + (W - L - R) + '" height="' + (H - B) + '" fill="transparent" tabindex="0"/></svg>' +
    '<div class="tip" hidden></div></div>';
}
function shortDate(d) { const t = new Date(d + 'T12:00:00'); return t.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
function wireChart(el, rows) {
  if (!el) return;
  const svg = el.querySelector('svg'), hit = el.querySelector('.hit'), tip = el.querySelector('.tip'), cross = el.querySelector('.cross');
  const kind = el.dataset.kind, key = el.dataset.key, n = rows.length;
  const W = 640, L = 36, R = 8, step = (W - L - R) / Math.max(1, n - (kind === 'line' ? 1 : 0));
  function show(i) {
    i = Math.max(0, Math.min(n - 1, i));
    const xx = kind === 'line' ? L + i * step : L + i * step + step / 2;
    cross.setAttribute('x1', xx); cross.setAttribute('x2', xx); cross.setAttribute('visibility', 'visible');
    tip.textContent = '';
    const b = document.createElement('b'); b.textContent = fmt(rows[i][key]);
    const s = document.createElement('span'); s.textContent = el.dataset.label + ' · ' + new Date(rows[i].day + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    tip.append(b, s); tip.hidden = false;
    const scale = svg.getBoundingClientRect().width / W, px = xx * scale;
    tip.style.left = Math.min(Math.max(0, px - 60), svg.getBoundingClientRect().width - 140) + 'px'; tip.style.top = '0px';
    el.dataset.i = i;
  }
  function hide() { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); }
  hit.addEventListener('pointermove', e => { const r = svg.getBoundingClientRect(); const xx = (e.clientX - r.left) / r.width * W; show(Math.round((xx - L - (kind === 'line' ? 0 : step / 2)) / step)); });
  hit.addEventListener('pointerleave', hide);
  hit.addEventListener('focus', () => show(n - 1));
  hit.addEventListener('blur', hide);
  hit.addEventListener('keydown', e => { const i = +(el.dataset.i || n - 1); if (e.key === 'ArrowLeft') { show(i - 1); e.preventDefault(); } if (e.key === 'ArrowRight') { show(i + 1); e.preventDefault(); } });
}

  const p = A.prospects.find(x => x.id === id); if (!p) return;
  const btns = document.querySelectorAll('button[onclick="deleteProspect(' + id + ')"]');
  const b = btns[0];
  if (b && b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'Confirm delete'; setTimeout(() => { if (b.isConnected) { b.dataset.armed = ''; b.textContent = 'Delete'; } }, 4000); return; }
  const { error } = await db.from('prospects').delete().eq('id', id);
  if (error) { toast('Could not delete: ' + error.message); return; }
  toast('Deleted'); loadAll();
}
async function setStatus(id, status) {
  const { error } = await db.from('prospects').update({ status, updated_at: new Date().toISOString() }).eq('id', id);
  if (error) { toast('Could not save: ' + error.message); return; }
  const p = A.prospects.find(x => x.id === id); if (p) p.status = status;
  toast('Status: ' + status); loadAll();
}
async function pitchLandlord(lid) {
  let p = A.prospects.find(x => String(x.landlord_id) === String(lid));
  if (!p) {
    const { data, error } = await db.from('prospects').insert({ kind: 'landlord', name: landlordName(lid), landlord_id: +lid, billing: 'monthly' }).select().single();
    if (error) { toast('Could not add: ' + error.message); return; }
    A.prospects.unshift(data); p = data;
    toast('Added to Outreach. Add their email before sending.');
  }
  openComposer(p.id, 'insights');
}

      '<tr><th>Returning visitors</th><td>Shows people come back while deciding, which makes a sponsor spot worth more than one view.</td></tr>' +
    '</tbody></table>' +
    '<h3>Landlord attention (sells insights, only if you choose to take landlord money)</h3><table><tbody>' +
      '<tr><th>Landlord page views and visitors</th><td>How many people looked at a landlord. The first line of any landlord pitch.</td></tr>' +
      '<tr><th>Average time on the page, rate clicks</th><td>Shows people read the reviews closely, not just glanced.</td></tr>' +
      '<tr><th>Searches with no match</th><td>Demand for landlords you don\'t list yet. Adding them grows reviews and pitch targets.</td></tr>' +

      '<tr><th>Verification funnel and problems</th><td>If "send failed" shows up, the email sender in Supabase needs attention.</td></tr>' +

// ===== Actions =====
function setTab(t) { A.tab = t; try { sessionStorage.setItem('rmc-admin-tab', t); } catch (e) {} render(); }
function setDays(d) { A.days = d; try { sessionStorage.setItem('rmc-admin-days', d); } catch (e) {} if (A.compose) { A.compose.subject = null; A.compose.body = null; } loadAll(); }
function sortBy(k) { A.sort = A.sort.key === k ? { key: k, dir: -A.sort.dir } : { key: k, dir: k === 'name' ? 1 : -1 }; render(); }
async function signIn() {
  const btn = $('#si-go'), err = $('#si-err');
  btn.disabled = true; btn.textContent = 'Signing in…'; err.hidden = true;
  const { data, error } = await db.auth.signInWithPassword({ email: $('#si-email').value.trim(), password: $('#si-pass').value });
  if (error) { btn.disabled = false; btn.textContent = 'Sign in'; err.textContent = error.message === 'Invalid login credentials' ? 'That email and password don\'t match an account.' : error.message; err.hidden = false; return; }
  A.user = data.user; await start();
}
async function signOut() { await db.auth.signOut(); A.user = null; A.data = null; A.prospects = []; render(); }
async function start() {
  render();
  await loadNames();
  await loadAll();
}
(async function boot() {
  const { data } = await db.auth.getSession();
  A.user = data && data.session ? data.session.user : null;
  if (A.user) start(); else render();
})();
</script>
