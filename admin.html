// Whole-number gridlines: a 1/2/5 x 10^k step, 3-5 lines
function niceScale(v) {
  const raw = Math.max(1, v) / 4, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
  const step = Math.max(1, (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p);
  return { step, max: step * Math.max(1, Math.ceil(Math.max(1, v) / step)) };

function chartSVG(id, rows, key, kind, color, label) {

  for (let v = 0; v <= max + 1e-9; v += tick) { const yy = y(v); g += '<line class="gridline" x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '"/><text class="axis" x="' + (L - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + fmt(v) + '</text>'; }
  const every = Math.ceil(n / 6);
  rows.forEach((r, i) => { if (i % every === 0 || i === n - 1) g += '<text class="axis" x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(shortDate(r.day)) + '</text>'; });
  let marks = '';
  if (kind === 'line') {
    const d = vals.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
    marks = '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    if (n <= 31) marks += vals.map((v, i) => '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="2.5" fill="' + color + '"/>').join('');
  } else {
    const bw = Math.max(2, Math.min(18, step - 2));
    marks = vals.map((v, i) => {
      if (!v) return '';
      const h = Math.max(1, y(0) - y(v)), x0 = x(i) - bw / 2, y0 = y(v), rr = Math.min(4, bw / 2, h);
      return '<path d="M' + x0 + ' ' + y(0) + 'V' + (y0 + rr) + 'Q' + x0 + ' ' + y0 + ' ' + (x0 + rr) + ' ' + y0 + 'H' + (x0 + bw - rr) + 'Q' + (x0 + bw) + ' ' + y0 + ' ' + (x0 + bw) + ' ' + (y0 + rr) + 'V' + y(0) + 'Z" fill="' + color + '"/>';
    }).join('');
  }
  return '<div class="chart" id="' + id + '" data-kind="' + kind + '" data-key="' + key + '" data-label="' + esc(label) + '" data-color="' + color + '">' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(label) + ' per day, last ' + A.days + ' days">' + g +
    '<line class="baseline" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(0) + '" y2="' + y(0) + '"/>' + marks +
    '<line class="cross" x1="0" x2="0" y1="' + T + '" y2="' + y(0) + '" visibility="hidden"/>' +
    '<rect class="hit" x="' + L + '" y="0" width="' + (W - L - R) + '" height="' + (H - B) + '" fill="transparent" tabindex="0"/></svg>' +
    '<div class="tip" hidden></div></div>';
}
function shortDate(d) { const t = new Date(d + 'T12:00:00'); return t.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
function wireChart(el, rows) {
  if (!el) return;
  const svg = el.querySelector('svg'), hit = el.querySelector('.hit'), tip = el.querySelector('.tip'), cross = el.querySelector('.cross');
  const kind = el.dataset.kind, key = el.dataset.key, n = rows.length;
  const W = 640, L = 36, R = 8, step = (W - L - R) / Math.max(1, n - (kind === 'line' ? 1 : 0));
  function show(i) {
    i = Math.max(0, Math.min(n - 1, i));
    const xx = kind === 'line' ? L + i * step : L + i * step + step / 2;
    cross.setAttribute('x1', xx); cross.setAttribute('x2', xx); cross.setAttribute('visibility', 'visible');
    tip.textContent = '';
    const b = document.createElement('b'); b.textContent = fmt(rows[i][key]);
    const s = document.createElement('span'); s.textContent = el.dataset.label + ' · ' + new Date(rows[i].day + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    tip.append(b, s); tip.hidden = false;
    const scale = svg.getBoundingClientRect().width / W, px = xx * scale;
    tip.style.left = Math.min(Math.max(0, px - 60), svg.getBoundingClientRect().width - 140) + 'px'; tip.style.top = '0px';
    el.dataset.i = i;
  }
  function hide() { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); }
  hit.addEventListener('pointermove', e => { const r = svg.getBoundingClientRect(); const xx = (e.clientX - r.left) / r.width * W; show(Math.round((xx - L - (kind === 'line' ? 0 : step / 2)) / step)); });
  hit.addEventListener('pointerleave', hide);
  hit.addEventListener('focus', () => show(n - 1));
  hit.addEventListener('blur', hide);
  hit.addEventListener('keydown', e => { const i = +(el.dataset.i || n - 1); if (e.key === 'ArrowLeft') { show(i - 1); e.preventDefault(); } if (e.key === 'ArrowRight') { show(i + 1); e.preventDefault(); } });
}

const fill = (tpl, v) => tpl.replace(/\{(\w+)\}/g, (m, k) => v[k] != null ? v[k] : m);
function openComposer(id, template) {
  const p = A.prospects.find(x => x.id === id);
  if (!p) return;
  if (p.status === 'opted_out') { toast(p.name + ' asked not to be emailed. The law (CAN-SPAM) says you must honor that.'); return; }
  const t = template || (p.kind === 'landlord' ? 'insights' : p.last_contacted_at ? 'followup' : 'sponsor');
  A.compose = { id, template: t, subject: null, body: null };
  A.tab = 'outreach'; render();
  const el = $('#composer'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function Composer() {

  if (A.compose.subject == null) A.compose.subject = fill(t.subject, v);
  if (A.compose.body == null) A.compose.body = fill(t.body, v);
  const s = senderSettings();
  const warn = t.landlordOnly ? '<div class="note"><strong>Selling to a landlord:</strong> the site promises that paying never changes a rating, the order of reviews or whether a review stays up, and that paying and non-paying landlords are treated the same. Don\'t offer, hint at or agree to anything about their reviews, and treat their reviews exactly like everyone else\'s.</div>' : '';
  const adsWarn = !t.landlordOnly && A.compose.template === 'sponsor' ? '<div class="note"><strong>Sponsors:</strong> anything paid on the site must be labeled "Sponsored" where it appears, and a sponsor never gets a say in reviews or ratings.</div>' : '';
  const missing = [];
  if (!p.email) missing.push('this prospect has no email address');
  if (!s.name) missing.push('your name');
  if (!s.address) missing.push('your mailing address');
  return '<h2 id="composer">Email ' + esc(p.name) + '</h2>' + warn + adsWarn +
    '<div class="composer"><div class="panel pad">' +
      '<div class="row" style="margin-bottom:12px"><label class="f" for="c-template" style="margin:0">Template</label><select class="i" id="c-template" style="max-width:320px" onchange="A.compose.template=this.value;A.compose.subject=null;A.compose.body=null;render()">' +
        Object.entries(TEMPLATES).map(([k, x]) => '<option value="' + k + '"' + (k === A.compose.template ? ' selected' : '') + '>' + esc(x.label) + '</option>').join('') + '</select></div>' +
      '<label class="f" for="c-to">To</label><input class="i" id="c-to" value="' + esc(p.email || '') + '" readonly />' +
      '<label class="f" for="c-subject" style="margin-top:10px">Subject</label><input class="i" id="c-subject" value="' + esc(A.compose.subject) + '" oninput="A.compose.subject=this.value;updatePreviewMeta()" />' +
      '<label class="f" for="c-body" style="margin-top:10px">Message</label><textarea class="i" id="c-body" oninput="A.compose.body=this.value;updatePreviewMeta()">' + esc(A.compose.body) + '</textarea>' +

        '<button class="btn primary" type="button" onclick="sendEmail()"' + (missing.length ? ' disabled' : '') + '>' + (s.send_with === 'mailto' ? 'Open in mail app' : 'Copy + open Proton Mail') + '</button>' +
        '<button class="btn" type="button" onclick="copyEmail()">Copy</button>' +
        '<button class="btn" type="button" onclick="markSent()">Mark as sent</button>' +
        '<button class="btn" type="button" onclick="A.compose=null;render()">Close</button>' +
      '</div></div>' +
      '<div class="panel pad"><h3>Numbers used</h3><p class="muted" style="font-size:12px;margin-bottom:10px">Last ' + A.days + ' days, from the dashboard. Change the range at the top to use a different window.</p><dl class="merge">' +
        Object.entries(v).filter(([k]) => !/sender|address|price|first_name|need|business/.test(k)).map(([k, x]) => '<dt>{' + esc(k) + '}</dt><dd>' + esc(x) + '</dd>').join('') + '</dl></div>' +

function updatePreviewMeta() {
  const el = $('#c-left'); if (!el || !A.compose) return;
  const left = (A.compose.body || '').match(/\[[a-z ]+\]|\{\w+\}/g);
  el.textContent = left ? 'Still to fill in: ' + [...new Set(left)].join(', ') : 'Ready to send.';
}
function sendEmail() {
  const p = A.prospects.find(x => x.id === A.compose.id); if (!p || !p.email) return;
  const s = senderSettings();
  if (!s.name || !s.address) { toast('Add your name and mailing address first (required by law)'); return; }
  const to = encodeURIComponent(p.email), su = encodeURIComponent(A.compose.subject || ''), body = encodeURIComponent(A.compose.body || '');
  if (s.send_with === 'mailto') {
    window.open('mailto:' + to + '?subject=' + su + '&body=' + body, '_blank', 'noopener');
    toast('Opened. Send it from ' + RMC_EMAIL + ', then press "Mark as sent".');
    return;
  }
  // Proton Mail has no pre-filled compose link: copy the email, open Proton, paste into a new message
  const text = 'To: ' + p.email + '\nSubject: ' + (A.compose.subject || '') + '\n\n' + (A.compose.body || '');
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(
    () => toast('Copied. In Proton Mail: New message, paste, send from ' + RMC_EMAIL + ', then "Mark as sent".'),
    () => toast('Copy blocked: use the Copy button, then paste into Proton Mail.'));
  window.open('https://mail.proton.me/u/0/inbox', '_blank', 'noopener');
}
async function copyEmail() {
  try { await navigator.clipboard.writeText('Subject: ' + (A.compose.subject || '') + '\n\n' + (A.compose.body || '')); toast('Copied'); }
  catch (e) { toast('Copy blocked by the browser. Select the text instead.'); }
}
async function markSent() {
  const p = A.prospects.find(x => x.id === A.compose.id); if (!p) return;
  const now = new Date().toISOString();
  const { error } = await db.from('outreach_log').insert({ prospect_id: p.id, template: A.compose.template, subject: A.compose.subject, channel: senderSettings().send_with });
  if (error) { toast('Could not save: ' + error.message); return; }
  await db.from('prospects').update({ last_contacted_at: now, updated_at: now, status: p.status === 'new' ? 'contacted' : p.status }).eq('id', p.id);
  A.compose = null; toast('Logged'); loadAll();
}

async function saveProspect() {
  const val = id => ($('#' + id).value || '').trim();
  const row = { kind: val('p-kind'), name: val('p-name'), contact_name: val('p-contact') || null, email: val('p-email') || null, website: val('p-website') || null,
    phone: val('p-phone') || null, landlord_id: val('p-landlord') ? +val('p-landlord') : null, deal_value: val('p-value') ? +val('p-value') : null,
    billing: val('p-billing'), notes: val('p-notes') || null, updated_at: new Date().toISOString() };
  if (!row.name) { toast('Add a name'); return; }
  const q = A.editing && A.editing.id ? db.from('prospects').update(row).eq('id', A.editing.id) : db.from('prospects').insert(row);
  const { error } = await q;
  if (error) { toast('Could not save: ' + error.message); return; }
  A.editing = null; toast('Saved'); loadAll();
}
function editProspect(id) { A.editing = Object.assign({}, A.prospects.find(x => x.id === id)); render(); const f = $('#p-name'); if (f) { f.scrollIntoView({ block: 'center' }); f.focus(); } }
async function deleteProspect(id) {
  const p = A.prospects.find(x => x.id === id); if (!p) return;
  const btns = document.querySelectorAll('button[onclick="deleteProspect(' + id + ')"]');
  const b = btns[0];
  if (b && b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'Confirm delete'; setTimeout(() => { if (b.isConnected) { b.dataset.armed = ''; b.textContent = 'Delete'; } }, 4000); return; }
  const { error } = await db.from('prospects').delete().eq('id', id);
  if (error) { toast('Could not delete: ' + error.message); return; }
  toast('Deleted'); loadAll();
}
async function setStatus(id, status) {
  const { error } = await db.from('prospects').update({ status, updated_at: new Date().toISOString() }).eq('id', id);
  if (error) { toast('Could not save: ' + error.message); return; }
  const p = A.prospects.find(x => x.id === id); if (p) p.status = status;
  toast('Status: ' + status); loadAll();
}
async function pitchLandlord(lid) {
  let p = A.prospects.find(x => String(x.landlord_id) === String(lid));
  if (!p) {
    const { data, error } = await db.from('prospects').insert({ kind: 'landlord', name: landlordName(lid), landlord_id: +lid, billing: 'monthly' }).select().single();
    if (error) { toast('Could not add: ' + error.message); return; }
    A.prospects.unshift(data); p = data;
    toast('Added to Outreach. Add their email before sending.');
  }
  openComposer(p.id, 'insights');
}

function Guide() {
  return '<section class="guide"><h2>What we track, and why it makes money</h2>' +
    '<p>Every number here is first-party: it goes from the site to your database, nowhere else. No cookies, no IP addresses, no names. Visitor IDs reset every month and are never attached to reviews.</p>' +
    '<h3>The audience (sells sponsorships)</h3><table><tbody>' +
      '<tr><th>Visitors, visits, phone share</th><td>Sponsors buy reach. "X people a month, most on phones, all about to move" is the whole pitch.</td></tr>' +
      '<tr><th>Where visits come from</th><td>Tells you which posts and channels to repeat. Tag links with <code>?utm_source=</code>.</td></tr>' +
      '<tr><th>Returning visitors</th><td>Shows people come back while deciding, which makes a sponsor spot worth more than one view.</td></tr>' +
    '</tbody></table>' +
    '<h3>Landlord attention (sells insights, only if you choose to take landlord money)</h3><table><tbody>' +
      '<tr><th>Landlord page views and visitors</th><td>How many people looked at a landlord. The first line of any landlord pitch.</td></tr>' +
      '<tr><th>Average time on the page, rate clicks</th><td>Shows people read the reviews closely, not just glanced.</td></tr>' +
      '<tr><th>Searches with no match</th><td>Demand for landlords you don\'t list yet. Adding them grows reviews and pitch targets.</td></tr>' +
    '</tbody></table>' +
    '<h3>Student products (sell the lease scanner)</h3><table><tbody>' +
      '<tr><th>Lease scans, PDF uploads</th><td>Real use of the free scanner, without ever storing a lease.</td></tr>' +
      '<tr><th>Waitlist offer shown → joined</th><td>The share of scanner users who ask for the paid version. Price it once this is steady.</td></tr>' +
    '</tbody></table>' +
    '<h3>Trust (protects all of it)</h3><table><tbody>' +
      '<tr><th>Reviews per day, verified share</th><td>The product. More verified reviews make every number above easier to sell, and protect against fake-review floods.</td></tr>' +
      '<tr><th>Verification funnel and problems</th><td>If "send failed" shows up, the email sender in Supabase needs attention.</td></tr>' +
    '</tbody></table>' +
    '<h3>Before you charge anyone</h3><ol>' +
      '<li>The site says "No landlord money. No sponsored rankings," the mission page says "We don\'t run ads," and the landlords page says there are no paid premium listings. Rewrite them to match what you actually sell before the first sale.</li>' +
      '<li>Label anything paid as "Sponsored" right where it appears.</li>' +
      '<li>Sales emails need your mailing address and a way to opt out. The templates include both.</li>' +
    '</ol></section>';
}

// ===== Actions =====
function setTab(t) { A.tab = t; try { sessionStorage.setItem('rmc-admin-tab', t); } catch (e) {} render(); window.scrollTo(0, 0); }
function setDays(d) { A.days = d; try { sessionStorage.setItem('rmc-admin-days', d); } catch (e) {} if (A.compose) { A.compose.subject = null; A.compose.body = null; } loadAll(); }
function sortBy(k) { A.sort = A.sort.key === k ? { key: k, dir: -A.sort.dir } : { key: k, dir: k === 'name' ? 1 : -1 }; render(); }
async function signIn() {
  const btn = $('#si-go'), err = $('#si-err');
  btn.disabled = true; btn.textContent = 'Signing in…'; err.hidden = true;
  const { data, error } = await db.auth.signInWithPassword({ email: $('#si-email').value.trim(), password: $('#si-pass').value });
  if (error) { btn.disabled = false; btn.textContent = 'Sign in'; err.textContent = error.message === 'Invalid login credentials' ? 'That email and password don\'t match an account.' : error.message; err.hidden = false; return; }
  if (await needsMfaCode()) { render(); return; }
  A.user = data.user; await start();
}
// Two-step sign-in is on for this account but this session hasn't given the code yet
async function needsMfaCode() {
  try {
    const { data } = await db.auth.mfa.getAuthenticatorAssuranceLevel();
    if (data && data.nextLevel === 'aal2' && data.currentLevel !== 'aal2') {
      const f = await db.auth.mfa.listFactors();
      const totp = f.data && (f.data.totp || []).find(x => x.status === 'verified');
      if (totp) { A.mfa.needCode = true; A.mfa.factorId = totp.id; return true; }
    }
  } catch (e) {}
  A.mfa.needCode = false;
  return false;
}
async function verifyMfa() {
  const btn = $('#mfa-go'), err = $('#mfa-err'), code = ($('#mfa-code').value || '').replace(/\D/g, '');
  btn.disabled = true; err.hidden = true;
  const { error } = await db.auth.mfa.challengeAndVerify({ factorId: A.mfa.factorId, code });
  if (error) { btn.disabled = false; err.textContent = 'That code didn\'t work. Use the current code from your app.'; err.hidden = false; return; }
  A.mfa.needCode = false;
  const { data } = await db.auth.getUser();
  A.user = data && data.user; await start();
}
async function loadMfa() {
  try { const f = await db.auth.mfa.listFactors(); A.mfa.factors = (f.data && f.data.totp) || []; } catch (e) { A.mfa.factors = []; }
}
async function startMfaEnroll() {
  const { data, error } = await db.auth.mfa.enroll({ factorType: 'totp', friendlyName: 'RateMyCrib admin ' + new Date().toISOString().slice(0, 10) });
  if (error) { toast('Could not start: ' + error.message + ' (Supabase → Authentication → Multi-Factor: turn on TOTP)'); return; }
  A.mfa.enrolling = { id: data.id, qr: data.totp && data.totp.qr_code, secret: data.totp && data.totp.secret };
  render();
}
async function finishMfaEnroll() {
  const code = (($('#mfa-new-code') || {}).value || '').replace(/\D/g, '');
  const { error } = await db.auth.mfa.challengeAndVerify({ factorId: A.mfa.enrolling.id, code });
  if (error) { toast('That code didn\'t work. Try the current one.'); return; }
  A.mfa.enrolling = null; await loadMfa(); toast('Two-step sign-in is on. Next time you sign in, you\'ll need the app code too.'); render();
}
function Security() {
  const on = A.mfa.factors.some(f => f.status === 'verified');
  if (on) return '<h2>Two-step sign-in</h2><div class="panel pad"><p><strong>On.</strong> Signing in here needs your password and a code from your authenticator app. The database also refuses admin requests from a session that skipped the code.</p></div>';
  const e = A.mfa.enrolling;
  return '<h2>Two-step sign-in</h2><div class="panel pad">' +
    (e ? '<p>Scan this with an authenticator app (Google Authenticator, 1Password, Authy…), then type the 6-digit code it shows.</p>' +
         (e.qr ? '<img src="' + esc(e.qr) + '" alt="QR code for your authenticator app" width="180" height="180" style="background:#fff;padding:8px;margin:8px 0" />' : '') +
         '<p class="muted" style="font-size:12px">Can\'t scan? Enter this key: <code>' + esc(e.secret || '') + '</code></p>' +
         '<div class="row"><label class="f" for="mfa-new-code" style="margin:0">Code</label><input class="i" id="mfa-new-code" inputmode="numeric" maxlength="6" style="max-width:140px" /><button class="btn primary" type="button" onclick="finishMfaEnroll()">Turn on</button></div>'
       : '<p>This page shows every student email on the list. Protect it with a second step: a 6-digit code from an authenticator app on your phone, on top of your password.</p>' +
         '<button class="btn primary" type="button" onclick="startMfaEnroll()">Turn on two-step sign-in</button>') +
    '</div>';
}
async function signOut() { await db.auth.signOut(); A.user = null; A.data = null; A.prospects = []; A.mfa = { factors: [], enrolling: null, needCode: false, factorId: null }; render(); }
async function start() {
  render();
  await Promise.all([loadNames(), loadMfa()]);
  await loadAll();
}
(async function boot() {
  const { data } = await db.auth.getSession();
  const user = data && data.session ? data.session.user : null;
  if (user && await needsMfaCode()) { render(); return; }
  A.user = user;
  if (A.user) start(); else render();
})();
</script>
</body>
</html>
